:root{--ink:#1B1B2F;--panel:#FBF5E6;--panel-2:#F1E7CF;--muted:#6A6478;--gold:#F2C230;--plum:#7A6AB0;--plum-dk:#2A1F4A;--red:#D94A3A;--go:#3FAE5A;
  --f-pix:"Silkscreen","Chakra Petch",ui-monospace,monospace;--f-body:"Chakra Petch","Leelawadee UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plum-dk)}
body{font-family:var(--f-body);color:var(--ink);background-image:radial-gradient(#3B2E63 1px,transparent 1.5px);background-size:8px 8px;padding:max(14px,env(safe-area-inset-top)) 12px 28px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 #120C24;padding:14px}
.top{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#7A6AB0,#4A3B80);color:#fff;padding:16px;border:3px solid var(--ink);box-shadow:5px 5px 0 #120C24}
.top img{width:64px;flex:none}
.top b{font-family:var(--f-pix);font-size:22px;color:var(--gold);display:block;letter-spacing:.06em}
.top span{font-size:14px;opacity:.9}
h2{font-family:var(--f-pix);font-size:14px;letter-spacing:.06em;margin:0 0 10px;display:flex;gap:8px;align-items:center}
h2 img{width:20px}
h2 small{font-family:var(--f-body);font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--panel-2);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px}
.btns a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btns a b{font-size:15.5px;display:flex;gap:6px;align-items:center}.btns a b img{width:20px}
.btns a span{font-size:12.5px;color:var(--muted);line-height:1.35}
.btns a.hot{background:var(--gold)}
.btns a.wide{grid-column:1/-1}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers a{text-decoration:none;color:var(--ink);text-align:center;border:2px solid var(--ink);padding:8px 4px;background:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.tiers a img{width:34px}
.tiers a.g{background:#FFF1B8}.tiers a.s{background:#EEF2F6}.tiers a.c{background:#FBE3CF}.tiers a.z{background:#DDEFFC}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border:2px solid var(--ink);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--ink);color:var(--gold);font-family:var(--f-pix);font-size:11px;letter-spacing:.05em;font-weight:400}
ol,ul{margin:0;padding-left:20px;line-height:1.65;font-size:15px}
.fix div{padding:8px 0;border-bottom:1px dotted #CBBF9F;font-size:15px;line-height:1.5}.fix div:last-child{border-bottom:0}
.fix b{display:block}
.sch td:first-child{font-family:var(--f-pix);font-size:12px;white-space:nowrap}
.sch tr.us td{background:#FFF1B8;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
/* credits */
.cred{background:#0E0A1C;color:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 #120C24;position:relative;height:460px;overflow:hidden;cursor:pointer}
.cred .roll{position:absolute;left:0;right:0;top:100%;text-align:center;padding:0 18px}
.cred.on .roll{animation:roll 95s linear forwards}
.cred.paused .roll{animation-play-state:paused}
.cred .hint{position:absolute;right:8px;bottom:6px;font-size:11px;color:#8B80B8;display:none}.cred.on .hint{display:block}
@keyframes roll{to{transform:translateY(calc(-100% - 480px))}}
.cred h3{font-family:var(--f-pix);color:var(--gold);font-size:24px;margin:0 0 4px}
.cred .k{font-family:var(--f-pix);font-size:11px;color:#B9AEDB;letter-spacing:.1em;margin-top:26px}
.cred .v{font-size:17px;font-weight:700;margin-top:4px;line-height:1.4}
.cred .v small{display:block;font-weight:500;font-size:13px;color:#C9C6E0}
.cred .sp{display:flex;gap:8px;justify-content:center;margin:18px 0}.cred .sp img{width:40px}
.cred .go{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(14,10,28,.86);border:0;color:#fff;font-size:16px;font-weight:700}
.cred .go b{font-family:var(--f-pix);color:var(--gold);font-size:20px}
.cred.on .go{display:none}
.foot{text-align:center;color:#B9AEDB;font-size:12px;line-height:1.6}
@media (max-width:480px){.tiers{grid-template-columns:repeat(2,1fr)}.btns{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.cred.on .roll{animation:none;position:static;padding:16px}.cred{height:auto}}
</style>
</head>

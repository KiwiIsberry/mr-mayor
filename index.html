<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Mr. Mayor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr. Mayor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: an 8-bit city-builder cartridge. Night-blue cabinet frame; cream "dialog box" panels with hard pixel shadows.
   Left: the pixel-art district (canvas, integer-scaled). Right: council desk. Bottom: build tray. Deliberately one look in any theme. */
:root{
  --cab:#262A48; --cab-2:#1E2140; --dot:#2E3356;
  --panel:#FBF5E6; --panel-2:#F1E7CF; --ink:#1B1B2F; --muted:#6A6478;
  --grass:#5CB85C; --red:#D94A3A; --gold:#F2C230; --sky:#5FA8E8; --plum:#7A6AB0; --go:#3FAE5A; --go-dk:#2B7D3E;
  --f-pix:"Silkscreen","Chakra Petch",ui-monospace,monospace;
  --f-body:"Chakra Petch","Leelawadee UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--cab)}
body{background:var(--cab);background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);background-size:8px 8px;color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(136px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pix{font-family:var(--f-pix);letter-spacing:.02em}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);min-width:0}
.box-pad{padding:12px 14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(24px,3.4vw,34px);color:var(--panel);line-height:1;text-shadow:3px 3px 0 var(--ink),0 0 0 var(--ink)}
.brand h1 span{color:var(--gold)}
.brand p{margin:0;color:#C9C6E0;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:3px solid var(--ink);background:var(--panel);box-shadow:3px 3px 0 var(--ink);padding:5px 11px;font-weight:600;font-size:13.5px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--gold)}
.seg{display:flex}
.seg .btn{box-shadow:none;font-family:var(--f-pix);font-size:12px;padding:5px 9px}
.seg .btn+.btn{border-left:0}
.seg{box-shadow:3px 3px 0 var(--ink)}

/* status */
.status{display:grid;grid-template-columns:1.2fr 1fr 1.1fr;gap:12px}
@media (max-width:600px){.status{grid-template-columns:1fr 1fr}.status .riskbox{grid-column:1 / -1}}
.stat{padding:8px 12px;position:relative}
.stat .k{font-family:var(--f-pix);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--f-pix);font-weight:700;font-size:26px;line-height:1.15;display:flex;align-items:center;gap:8px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400}
.stat .s{font-size:12.5px;color:var(--muted)}
.coinimg{width:22px;height:22px;image-rendering:pixelated}
.track{display:flex;gap:4px;margin-top:6px}
.track .yr{display:flex;gap:2px;flex:1}
.track i{flex:1;height:8px;background:#DCD2B8;border:1px solid var(--ink)}
.track i.done{background:var(--muted)} .track i.now{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--panel)}}
.gauge{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:5px}
.gauge i{height:10px;background:#DCD2B8;border:1px solid var(--ink)}
.gauge i.on{background:var(--gold)} .gauge i.on.hi{background:var(--red)}
.float{position:absolute;right:10px;top:4px;font-family:var(--f-pix);font-weight:700;font-size:15px;animation:floatup 1.3s steps(8) forwards}
.float.up{color:var(--go)} .float.down{color:var(--red)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

/* main */
.main{display:grid;grid-template-columns:auto minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mapbox{padding:10px;justify-self:center}
.mapgrid{display:grid;grid-template-columns:18px auto;grid-template-rows:18px auto;gap:4px}
.lx,.ly{display:grid;font-family:var(--f-pix);font-size:11px;color:var(--muted);text-align:center}
.lx{align-items:end} .ly{align-items:center}
.lx span.hl,.ly span.hl{color:var(--red);font-weight:700}
#stage{position:relative;line-height:0}
#city{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid var(--ink);touch-action:manipulation;max-width:100%}
#stage.shake{animation:shake .08s steps(2) infinite}
@keyframes shake{0%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(2px,3px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:4px}
.legend{flex-direction:column;align-items:center}.legend>div{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}
.legend .zl span{display:inline-flex;align-items:center;gap:4px;color:var(--ink)} .legend .zl i{width:12px;height:12px;border:2px solid var(--ink);display:inline-block}
.zt{font-weight:700;font-size:22px;line-height:1.1}
.goal .ck{width:auto;min-width:20px;padding:0 2px;color:var(--gold)} .goal.s1 .ck,.goal.s2 .ck{background:var(--ink)}
.goal.s2 .bar i{background:repeating-linear-gradient(90deg,var(--go) 0 6px,var(--go-dk) 6px 8px)}
.goal .bar{position:relative} .goal .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.goal .gv small{font-size:11px;color:var(--muted)}
.goalnote{font-size:12.5px;color:var(--muted)} .goalnote.bad{color:var(--red);font-weight:700}
.stats3.s4{grid-template-columns:repeat(4,1fr)} .stats3.s4 b{color:var(--gold);text-shadow:1px 1px 0 var(--ink)}

.tsteps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:-4px 0 8px;font-size:11.5px;color:var(--muted)}
.tsteps i{font-style:normal;font-family:var(--f-pix);font-weight:700;font-size:12px;border:2px solid var(--ink);padding:0 5px;background:var(--panel-2);color:var(--ink)}
.tsteps i.done{text-decoration:line-through;opacity:.45}.tsteps i.now{background:var(--gold)}
.tsteps b{color:var(--ink);font-size:11px}.tsteps span{flex-basis:100%}
#splash .evsplash{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(720px,96vw)}
#splash.out .evsplash{transform:scale(.85) translateY(30px);opacity:0;transition:transform .25s ease-in,opacity .25s ease-in}
#splash .evhead{font-family:var(--f-pix);font-weight:700;font-size:18px;color:var(--panel);background:var(--ink);border:3px solid var(--panel);padding:3px 12px;animation:pop .3s ease-out both}
#splash .ecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
#splash .ecard{position:relative;will-change:transform,opacity;animation:ecdeal .45s cubic-bezier(.2,1.25,.4,1) var(--d) both}
#splash .ecard>div{border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);will-change:transform}
#splash .efront{background:var(--panel-2);padding:10px;display:flex;flex-direction:column;gap:5px;transform:scaleX(0);animation:ecfront .22s ease-out calc(var(--d) + .55s) both}
#splash .eback{position:absolute;inset:0;background:var(--cab);background-image:repeating-linear-gradient(45deg,#2E3356 0 6px,#262A48 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--panel);font-family:var(--f-pix);font-weight:700;font-size:22px;z-index:1;animation:ecback .22s ease-in calc(var(--d) + .33s) both}
#splash .eback b{color:var(--gold)} #splash .eback i{font-style:normal;font-size:13px;color:#C9C6E0}
@keyframes ecdeal{0%{transform:translateY(120px) rotate(-12deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes ecfront{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ecback{0%{transform:scaleX(1)}99%{transform:scaleX(0);opacity:1}100%{transform:scaleX(0);opacity:0;visibility:hidden}}
#splash .ecard.plus .efront{background:#E3F2D6} #splash .ecard.minus .efront{background:#F8DDD6} #splash .ecard.special .efront{background:#DDEBF7}
#splash .sk2{font-family:var(--f-pix);font-size:11px;letter-spacing:.08em;color:var(--muted)}
#splash .et{font-weight:700;font-size:22px;line-height:1.15}
#splash .eb{font-size:14px;color:var(--ink);opacity:.85;min-height:2.6em}
#splash .delta{align-self:center;display:flex;align-items:center;gap:8px;font-family:var(--f-pix);font-weight:700;font-size:28px;padding:4px 14px;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:boom .4s cubic-bezier(.2,1.4,.4,1) calc(var(--d) + .85s) both;transform:rotate(-4deg)}
#splash .delta img{width:30px;height:30px;image-rendering:pixelated}
#splash .delta.plus{background:var(--go);color:#fff;text-shadow:2px 2px 0 var(--go-dk)}
#splash .delta.minus{background:var(--red);color:#fff;text-shadow:2px 2px 0 #8E2A22;font-size:22px}
#splash .delta.special{background:var(--sky);color:#fff;text-shadow:2px 2px 0 #2F5F9E;font-size:22px}
#splash .delta.none{background:var(--panel);color:var(--muted);font-size:18px}
@keyframes boom{0%{transform:scale(2.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
#splash .evinc{display:flex;align-items:center;gap:8px;background:var(--gold);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:5px 14px;font-weight:700;font-size:18px;animation:boom .4s cubic-bezier(.2,1.4,.4,1) var(--d) both}
#splash .evinc img{width:22px;height:22px;image-rendering:pixelated}
#splash .evsplash .skip{color:#C9C6E0;font-size:12px}
@media (max-width:560px){#splash .ecards{gap:8px}#splash .et{font-size:16px}#splash .eb{font-size:12px}#splash .delta{font-size:18px;padding:3px 8px}#splash .delta img{width:20px;height:20px}#splash .efront{padding:6px}}
.modal.intro{max-width:640px;gap:8px;padding:14px 18px}.modal.intro h3{font-size:24px}
.ihead{display:flex;align-items:center;gap:10px;font-size:20px}.ihead .inum{font-family:var(--f-pix);font-size:12px;background:var(--ink);color:var(--panel);padding:2px 7px}
.ibody{display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.5}
.ibody p{margin:0}.ibody p.sm{font-size:13px;color:var(--muted)}
.ibody img{image-rendering:pixelated}
.ig4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ig4>div{border:3px solid var(--ink);background:var(--panel-2);padding:8px;display:grid;grid-template-columns:34px 1fr;column-gap:8px;align-items:center}
.ig4 img{grid-row:span 2;width:30px;height:30px;object-fit:contain}.ig4>div>b{font-size:15px}.ig4 span{font-size:12.5px;color:var(--muted);line-height:1.3}
.ig4.zones .z-old{background:#DCC193}.ig4.zones .z-river{background:#7FD6C4}.ig4.zones .z-soft{background:#B9A36B}.ig4.zones .z-open{background:#A8D86E}.ig4.zones span{color:var(--ink)}
.bt{display:flex;flex-direction:column;gap:5px}
.bt>div{display:grid;grid-template-columns:52px 1fr;column-gap:10px;align-items:center;border:2px solid var(--ink);background:var(--panel-2);padding:3px 8px}
.bt>div>img,.bt>div>.tico4,.bt>div>.gl{grid-row:span 2;justify-self:center}
.bt>div>img{width:32px;height:32px;object-fit:contain}.bt>div>img.wide{width:48px;height:24px}.bt>div>img.tall{width:18px;height:36px}
.bt>div>b{font-size:14.5px;line-height:1.3}.bt span{font-size:12.5px;line-height:1.35}
.bt .tico4{display:grid;grid-template-columns:1fr 1fr;gap:2px}.bt .tico4 img{height:16px;width:auto;max-width:24px}
.bt .gl{font-style:normal;font-family:var(--f-pix);font-weight:700;font-size:22px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.flow li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.flow li>b{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--gold);border:3px solid var(--ink);font-family:var(--f-pix)}
.flow li>div>b{display:block}.flow li>div>span{font-size:13.5px;color:var(--ink);opacity:.85}
.exc{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);background:#F8D5CF;padding:8px}.exc img{width:30px;height:30px}.exc>div>b{display:block}.exc>div>span{font-size:13px}
.itab{border-collapse:collapse;width:100%;font-size:14px}.itab td,.itab th{border:2px solid var(--ink);padding:5px 8px}.itab th{background:var(--ink);color:var(--panel)}
.itab td:not(:first-child){text-align:center;font-family:var(--f-pix);font-weight:700}.itab img{width:18px;height:18px;vertical-align:-3px;margin-right:6px;object-fit:contain}
.ibody .rk{text-align:center;font-size:13.5px}
.idots{display:flex;justify-content:center;gap:6px}.idots button{width:12px;height:12px;padding:0;border:2px solid var(--ink);background:var(--panel)}.idots button.on{background:var(--gold)}
.inav{display:grid;grid-template-columns:1fr 2fr;gap:10px}.inav .primary{padding:11px}
@media (max-width:520px){.ig4{grid-template-columns:1fr}.ihead{font-size:17px}}
.modal.start{max-width:460px;align-items:stretch;text-align:center}
.startart{border:3px solid var(--ink);line-height:0}.startart img{width:100%;aspect-ratio:64/36;image-rendering:pixelated}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.langpick button{border:3px solid var(--ink);background:var(--panel-2);box-shadow:4px 4px 0 var(--ink);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.langpick button b{font-size:24px}.langpick button span{font-size:13px;color:var(--muted)}
.langpick button:hover,.langpick button:focus-visible{background:var(--gold)}
.langpick button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.menu{display:flex;flex-direction:column;gap:10px}.menu .primary small{display:block;font-size:12px;font-weight:500;text-shadow:none;opacity:.9}
.langsw{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
/* desk */
.desk{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.head h2{margin:0;font-size:18px;font-weight:700}
.tagk{font-family:var(--f-pix);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--panel);background:var(--ink);padding:2px 6px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (max-width:440px){.cards{grid-template-columns:1fr}}
.card{border:3px solid var(--ink);background:var(--panel-2);padding:9px 10px;min-height:112px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;box-shadow:3px 3px 0 var(--ink)}
.card .ck{font-family:var(--f-pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .t{font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance}
.card .b{font-size:13.5px;color:var(--muted)}
.card.plus{background:#E3F2D6} .card.minus{background:#F8DDD6} .card.special{background:#DDEBF7}
.card.dis{background:#F8D5CF} .card.blocked{background:#DDF1DF} .card.loc{background:var(--panel)}
.card.empty{align-items:center;justify-content:center;text-align:center;color:var(--muted);border-style:dashed;background:transparent;box-shadow:none;font-size:13px}
.card .real{font-size:12px;color:var(--muted);border-top:2px dotted var(--ink);padding-top:4px;margin-top:3px}
.card .icon{width:auto;height:28px;max-width:44px;image-rendering:pixelated}
.deal{animation:deal .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes deal{0%{transform:translateY(40px) rotate(-8deg) scale(.85);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.flip{animation:flip .5s ease-out both}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:none}}
.cellcode{font-family:var(--f-pix);font-weight:700;font-size:38px;line-height:1}
.card:not(.empty){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:1px;align-content:start;min-height:0}
.card:not(.empty)>*{grid-column:2}
.card>.cart,.card>.cartw{grid-column:1;grid-row:1 / span 5;align-self:start}
.card .cart{width:128px;height:72px;object-fit:contain;image-rendering:pixelated;border:2px solid var(--ink);display:block;background:#CDEBFA}
.card .cartw .cart{width:128px}
.card.empty{min-height:56px}
@media (max-width:420px){.card .cart,.card .cartw .cart{width:104px;height:58.5px}}
.card .cartw{position:relative}.card .cstamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(221,241,223,.55)}
.card .cstamp img{height:40px;width:auto;image-rendering:pixelated;animation:got .5s steps(4)}
.card.deal .cart{animation:artin .6s steps(6) both;animation-delay:inherit}
@keyframes artin{0%{filter:brightness(2.2) saturate(0)}100%{filter:none}}
.zbar{display:grid;gap:0;margin:4px 0}
.zbar>i{display:block}
.zb{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);padding:3px 6px;min-width:0;box-shadow:2px 2px 0 var(--ink);margin:0 2px}
.zb img{width:22px;height:22px;image-rendering:pixelated;flex:none}.zb img.own{width:14px;height:14px;vertical-align:-2px}
.zb b{display:block;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb span{display:block;font-size:11px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb.z-old{background:repeating-linear-gradient(0deg,#DCC193 0 6px,#C9A97A 6px 8px)}
.zb.z-river{background:repeating-linear-gradient(90deg,#7FD6C4 0 8px,#5FBFAE 8px 10px)}
.zb.z-soft{background:radial-gradient(#8C7744 1px,transparent 1.5px) 0 0/6px 6px,#B9A36B}
.zb.z-open{background:radial-gradient(#F2C230 1px,transparent 1.5px) 0 0/9px 9px,#A8D86E}
.zb.hit{animation:zhit .5s steps(2) 4;outline:3px solid var(--red)}
@media (max-width:640px){.zb span{display:none}.zb b{font-size:12px}.zb img{width:16px;height:16px}.zb{padding:2px 4px;gap:4px}}
@keyframes zhit{50%{transform:translateY(-3px);filter:brightness(1.25)}}
.tray .h2{display:none}
.hinfo{font-size:12.5px;line-height:1.5;margin:6px 2px 0;min-height:38px;color:var(--ink)}
.hinfo .th{display:inline-flex;align-items:center;gap:3px;border:2px solid var(--ink);padding:0 5px;margin:1px 2px;background:#F8D5CF;font-weight:700}
.hinfo .th.safe{background:#CDEBC9}.hinfo .th small{font-weight:500}
.hinfo img{width:14px;height:14px;image-rendering:pixelated}
.hinfo .zn.z-old{background:#DCC193}.hinfo .zn.z-river{background:#7FD6C4}.hinfo .zn.z-soft{background:#B9A36B}.hinfo .zn.z-open{background:#A8D86E}.hinfo .zn{padding:0 4px;border:2px solid var(--ink)}
#splash{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#splash.show,#splash.out{display:flex}
#splash .sp-bg{position:absolute;inset:0;background:rgba(14,15,34,.55);animation:fadein .2s steps(3)}
#splash.out .sp-bg{opacity:0;transition:opacity .25s}

@keyframes slam{0%{transform:scale(2.2) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}

@keyframes fadein{from{opacity:0}}
.goal.gain{animation:gain .6s steps(3) 3}.goal.gain .ck{animation:got .5s steps(4) 2}

.starrow{display:flex;justify-content:center;gap:6px;font-size:34px;line-height:1}

@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(90deg)}50%{transform:translateY(0) rotate(180deg)}75%{transform:translateY(-6px) rotate(270deg)}100%{transform:rotate(360deg)}}
.die.land{animation:land .3s steps(3)}
@keyframes land{0%{transform:translateY(-8px)}60%{transform:translateY(2px)}100%{transform:none}}

.hint::before{content:"!";font-family:var(--f-pix);font-weight:700;background:var(--gold);border:2px solid var(--ink);width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}

/* totems + goals */
.totems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.totem{border:3px solid var(--ink);background:var(--panel-2);box-shadow:3px 3px 0 var(--ink);padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;text-align:center;line-height:1.2;min-width:0;font-weight:600}

/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cab-2);border-top:3px solid var(--ink);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #0E0F22}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.choice button{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* toast + modal */
.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translate(-50%,-24px);opacity:0;z-index:60;pointer-events:none;

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function sbase(x,mood){
  if(mood==="dark"){x.fillStyle="#5F6B80";x.fillRect(0,0,SW,SGY)}
  else if(mood==="warm"){x.fillStyle="#F6D9B0";x.fillRect(0,0,SW,SGY)}
  else {x.fillStyle="#CDEBFA";x.fillRect(0,0,SW,SGY);x.fillStyle="#E3F4FC";x.fillRect(0,0,SW,8)}
  x.fillStyle=PAL.l;x.fillRect(0,SGY,SW,SH-SGY);x.fillStyle=PAL.k;x.fillRect(0,SGY,SW,1);
  x.fillStyle=PAL.G;for(let i=1;i<SW;i+=5){x.fillRect(i,SGY+2+(i%3),1,1);x.fillRect(i+2,SGY+4-(i%2),1,1)}}
function srain(x,n){for(let i=0;i<n;i++){const px=(i*13+i*i)%SW,py=(i*7)%24+1;x.fillStyle="#7FC1F2";x.fillRect(px,py,1,2)}}

function applyEvent(k){
  const e=EV[k], f=count("factory"), fo=count("factory",1); let d=0;
  switch(k){
    case "tourism": d=count("shop",1); break;
    case "investor": d=fo?2+fo:0; break;
    case "grant": d=4; break; case "tax": d=3; break;
    case "wastewater": d=-2*f; break; case "road": d=-3; break;
    case "power": d=-(count("shop")+f); break;
    case "parkdemand": d=count("green")<f?-3:0; break;
    case "drill": S.mod.noroll=true; break;
    case "volunteers": S.mod.freerepair=(S.mod.freerepair||0)+1; break;
    case "material": S.mod.buildcost=(S.mod.buildcost||0)+2; break;
    case "totemsale": S.mod.totemdisc=(S.mod.totemdisc||0)+3; break;
    case "movein": S.mod.freehouse=(S.mod.freehouse||0)+1; break;
    case "strike": S.mod.nofac=true; break;
    case "holiday": S.mod.noshop=true; break;
    case "tide": S.mod.riskup=(S.mod.riskup||0)+2; break;
  }
  if(d) S.coins=Math.max(0,S.coins+d);
  log(`${e.th}${d?` (${d>0?"+":""}${d})`:""}`,`${e.en}${d?` (${d>0?"+":""}${d})`:""}`,d>0?"good":d<0?"bad":"");
  return d;
}

/* ---------- hazard-specific card destruction ---------- */
function fxCanvas(dc,pad){ const r=dc.getBoundingClientRect(), c=document.createElement("canvas"); c.className="cardfx";

    if(fa>=0) out.push(a); if((fa>=0)!==(fb>=0)){ const t=fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]) } }

        if(Math.random()<.08) P.push({x:px,y:py,vx:.5,vy:-.8,l:0,m:50,c:"#3A3F4A",s:6}) }

    const cr=[]; for(let b=0;b<5;b++){ let px=W*(.3+Math.random()*.4), py=H*(.35+Math.random()*.3); const ang=b*1.256+Math.random()*.6, line=[[px,py]]; for(let s=0;s<14;s++){ px+=Math.cos(ang)*W*.05+(Math.random()-.5)*8; py+=Math.sin(ang)*H*.05+(Math.random()-.5)*8; line.push([px,py]) } cr.push(line) }

      x.clearRect(0,0,c.width,c.height); x.strokeStyle="#1B1B2F"; x.lineWidth=3; for(const l of cr){ x.beginPath(); const n=Math.max(2,Math.floor(l.length*p)); l.slice(0,n).forEach((q,i)=>i?x.lineTo(pad+q[0],pad+q[1]):x.moveTo(pad+q[0],pad+q[1])); x.stroke() } });

    const pts=gy.map((yy,j)=>gx.map((xx,i)=>[i&&i<3?xx+J():xx,j&&j<3?yy+J():yy])), frags=[];

    for(let j=0;j<3;j++) for(let i=0;i<3;i++){ const q=[pts[j][i],pts[j][i+1],pts[j+1][i+1],pts[j+1][i]];
      const f=dc.cloneNode(true); f.classList.add("frag"); f.style.animation="none";
      f.querySelectorAll("*").forEach(n=>n.style.animation="none"); const bk=f.querySelector(".eback"); if(bk) bk.remove(); const fc=f.querySelector(".dface"); if(fc) fc.style.transform="none"; f.style.clipPath=`polygon(${q.map(v=>`${v[0]*100}% ${v[1]*100}%`).join(",")})`;

      host.appendChild(f); frags.push({f,vx:(i-1)*2.2+(Math.random()-.5)*2,vy:-2-Math.random()*2.5,rv:(Math.random()-.5)*14}) }

let AC=null, MUTED=false; try{MUTED=localStorage.getItem("mm-mute")==="1"}catch(e){}
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null} } if(AC&&AC.state==="suspended") AC.resume().catch(()=>{}); return AC }
document.addEventListener("pointerdown",()=>{ if(!MUTED) ac() },{passive:true});
function tone(f,d,o){ o=o||{}; const a=ac(); if(!a||MUTED) return; const t=a.currentTime+(o.at||0);
  const osc=a.createOscillator(), g=a.createGain(); osc.type=o.type||"square"; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.vol||.05; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t+d+.02) }
function noise(d,o){ o=o||{}; const a=ac(); if(!a||MUTED) return; const t=a.currentTime+(o.at||0);
  const len=Math.max(1,Math.floor(a.sampleRate*d)), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(o.crackle?(Math.random()<.08?1:.15):1);
  const src=a.createBufferSource(); src.buffer=buf; const fl=a.createBiquadFilter(); fl.type=o.ftype||"lowpass"; fl.frequency.setValueAtTime(o.f||1200,t);
  if(o.fto) fl.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  const g=a.createGain(), v=o.vol||.08; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(t); src.stop(t+d+.02) }

function tutEnd(done){ TUT.on=false; coach(); if(done) setTimeout(()=>toast(T("จบการสอนแล้ว ขอให้เป็นนายกฯ ที่ดีที่สุด!","Tutorial done. Go be the best mayor!"),"good"),400) }
function tutTick(){
  if(!TUT.on) return;
  let st=TSTEPS[TUT.step];
  while(st&&((st.done&&st.done())||(st.skip&&st.skip()))){ TUT.step++; st=TSTEPS[TUT.step] }
  if(!st){ tutEnd(true); return }
  if(st.enter&&TUT.entered!==TUT.step&&S.phase==="build"&&!S.busy){ TUT.entered=TUT.step; st.enter(); return }
  coach();
}
function coach(){
  let el=$("coach"), ring=$("coachring");
  if(!el){ el=document.createElement("div"); el.id="coach"; document.body.appendChild(el); ring=document.createElement("div"); ring.id="coachring"; document.body.appendChild(ring) }
  const st=TUT.on&&TSTEPS[TUT.step];
  const blocked=!st||S.modal||S.busy||$("splash").className.includes("show")||(st.show&&!st.show())||(!st.show&&S.phase!=="build");
  const tgt=st&&!blocked&&document.querySelector(st.sel);
  if(!tgt){ el.className=""; ring.className=""; return }
  if(el.dataset.k!==String(TUT.step)){ el.dataset.k=TUT.step; try{tgt.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}
    el.innerHTML=`<div class="cstep">${T("สอนเล่น","Tutorial")} ${TUT.step+1}/${TSTEPS.length}</div><p>${T(st.th,st.en)}</p><div class="cbtn">${st.next?`<button type="button" class="primary" data-tut="next">${T("ถัดไป ▶","Next ▶")}</button>`:""}<button type="button" class="ghostbtn" data-tut="skip">${T("ข้ามการสอน","Skip tutorial")}</button></div>` }
  const r=tgt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  ring.className="on"; Object.assign(ring.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px"});
  el.className="on"; const w=Math.min(320,vw-24); el.style.width=w+"px"; const h=el.offsetHeight;
  let left=Math.max(12,Math.min(vw-w-12,r.left+r.width/2-w/2)), top=r.bottom+14;
  if(top+h>vh-8) top=r.top-h-14;
  if(top<8){ // big target (the map): put the bubble beside it, or pinned to the bottom edge
    if(vw-r.right>=w+24){ left=r.right+14; top=Math.max(8,Math.min(vh-h-8,r.top+r.height/2-h/2)) }
    else if(r.left>=w+24){ left=r.left-w-14; top=Math.max(8,Math.min(vh-h-8,r.top+r.height/2-h/2)) }
    else top=Math.max(8,Math.min(vh-h-8,r.bottom-h-10)) }
  el.style.left=left+"px"; el.style.top=top+"px";
}
addEventListener("resize",()=>TUT.on&&coach()); setInterval(()=>{ if(TUT.on) coach() },300);

/* ---------- end-of-term summary ---------- */
function lessons(){
  const st=S.stats, L=[], blds=S.pieces.filter(p=>p.type!=="green"), zc={};
  blds.forEach(p=>{const z=zoneOf(p.cells[0][0],p.cells[0][1]); zc[z]=(zc[z]||0)+1});
  const zTop=Object.keys(zc).sort((a,b)=>zc[b]-zc[a])[0], share=zTop&&blds.length?zc[zTop]/blds.length:0, zh=(st.zhit||{})[zTop]||0;
  if(!st.dis) L.push(["เมืองคุณไม่เจอภัยเลยตลอดวาระ ถือว่าโชคดีมาก แต่ในชีวิตจริงเราไม่รู้ว่าภัยจะมาเมื่อไร จึงต้องเตรียมพร้อมไว้เสมอ","No disaster hit your city all term. Lucky! In real life nobody knows when one will come, so cities prepare anyway."]);
  if(st.blocked) L.push([`Totem กันภัยไว้ได้ทั้งใบ ${st.blocked} ครั้ง การเตรียมพร้อมก่อนภัยมา คุ้มกว่าตามซ่อมทีหลัง`,`Your Totems blocked ${st.blocked} whole disaster card(s). Preparing before a disaster beats repairing after it.`]);
  if(st.saved) L.push([`การเสริมความแข็งแรงช่วยอาคารไว้ ${st.saved} หลัง ใช้เงินน้อยกว่าสร้างใหม่มาก`,`Reinforcing saved ${st.saved} building(s), far cheaper than rebuilding.`]);
  if(blds.length>=4&&share>=.6&&zh>=2) L.push([`อาคาร ${Math.round(share*100)}% ของเมืองอยู่ใน${ZONES[zTop].th} และโดนภัยในโซนนี้ ${zh} หลัง การกระจายเมืองไปหลายโซนช่วยไม่ให้ภัยครั้งเดียวทำลายเมืองทั้งหมด`,`${Math.round(share*100)}% of your buildings were in ${ZONES[zTop].en}, and ${zh} were hit there. Spreading out keeps one disaster from wrecking the whole city.`]);
  if((st.rep||0)>=10) L.push([`คุณจ่ายค่าซ่อมไป ${st.rep} เหรียญ ถ้าเสริมความแข็งแรงไว้ก่อน (หลังละ 3) จะถูกกว่ามาก`,`You spent ${st.rep} coins on repairs. Reinforcing first (3 each) would have cost much less.`]);
  if(st.hits>=5&&S.totems.length<2) L.push([`อาคารพังรวม ${st.hits} หลัง แต่มี Totem แค่ ${S.totems.length} อัน การลงทุนป้องกันภัยเร็วขึ้นอาจช่วยได้มาก`,`${st.hits} buildings were hit, but you had only ${S.totems.length} Totem(s). Investing in protection earlier could have helped.`]);
  if((st.ffhits||0)>0) L.push(["ไฟไหม้โรงงานลามไปถึงอาคารที่อยู่ติดกัน ในชีวิตจริงผังเมืองจึงแยกโรงงานออกจากบ้านคน","A factory fire spread to the buildings touching it. That is why real cities zone factories away from homes."]);
  if(!L.length) L.push(["เมืองที่รับมือภัยได้ดี ต้องเติบโตไปพร้อมกับการป้องกัน ไม่ใช่เลือกอย่างใดอย่างหนึ่ง","A resilient city grows and protects itself at the same time, not one or the other."]);
  return L.slice(0,3);
}
function realFact(){ const hz=S.stats.hz||{}; const ks=Object.keys(hz).filter(k=>hz[k]); const k=ks.length?ks.sort((a,b)=>hz[b]-hz[a])[0]:TOT[rnd(TOT.length)]; return {k,f:DIS[k].real} }

/* ---------- Best Mayor celebration ---------- */
function celebrate(cb){
  SFX.fanfare();
  if(reduce()){ setTimeout(cb,600); return }
  const o=document.createElement("div"); o.id="party";
  o.innerHTML=`<canvas></canvas><div class="rays"></div><div class="flash"></div><div class="pcrown">👑</div><div class="ptitle"><span>BEST</span><span>MAYOR</span></div><div class="psub">${T("นายกฯ ที่ดีที่สุด · ครบ 8 ดาว","A perfect 8-star term")}</div><div class="pstars">${[...Array(8)].map((_,i)=>`<i style="animation-delay:${1.1+i*.12}s">★</i>`).join("")}</div>`;
  document.body.appendChild(o);
  const cvs=o.querySelector("canvas"), x=cvs.getContext("2d"); let W,H; const fit=()=>{W=cvs.width=Math.ceil(innerWidth/4);H=cvs.height=Math.ceil(innerHeight/4)}; fit();
  const P=[], cols=["#F2C230","#FFE680","#D94A3A","#7FC1F2","#5CB85C","#F4F4F4","#C58CF2"];
  const burst=()=>{ const cx=W*(.15+Math.random()*.7), cy=H*(.12+Math.random()*.45), c=cols[rnd(cols.length)], c2=cols[rnd(cols.length)];
    for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, s=.6+Math.random()*1.3; P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:55+rnd(30),c:i%3?c:c2}) } };
  for(let i=0;i<60;i++) P.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*.3,vy:.4+Math.random()*.6,l:0,m:400,c:cols[rnd(cols.length)],conf:1});
  const t0=performance.now(); let lastB=0, done=false;
  const end=()=>{ if(done) return; done=true; o.classList.add("out"); setTimeout(()=>{o.remove();cb()},450) };
  o.addEventListener("click",end);
  const frame=now=>{ if(done) return; const t=now-t0; if(t-lastB>380&&t<4200){ burst(); lastB=t }
    x.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.l++; p.x+=p.vx; p.y+=p.vy; if(!p.conf){p.vy+=.025;p.vx*=.985} else p.x+=Math.sin((p.l+i)/12)*.2;
      if(p.l>p.m||p.y>H+4){P.splice(i,1);continue} x.globalAlpha=p.conf?1:Math.max(0,1-p.l/p.m); x.fillStyle=p.c; x.fillRect(Math.round(p.x),Math.round(p.y),p.conf?2:1,p.conf?1+(p.l>>3)%2:1) }
    x.globalAlpha=1; if(t>5600) end(); else requestAnimationFrame(frame) };
  requestAnimationFrame(frame);
}

/* ---------- city image to keep ---------- */
async function cityImage(name){
  try{ await document.fonts.ready }catch(e){}
  const W=480,H=720,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.imageSmoothingEnabled=false;
  const n=typeof S.result==="number"?S.result:stars(), rk=rankOf(n), best=n>=8;
  x.fillStyle=best?"#2A2140":"#FBF5E6"; x.fillRect(0,0,W,H);
  x.fillStyle=best?"#F2C230":"#1B1B2F"; x.fillRect(0,0,W,8); x.fillRect(0,H-8,W,8); x.fillRect(0,0,8,H); x.fillRect(W-8,0,8,H);
  x.textAlign="center"; x.fillStyle=best?"#F2C230":"#1B1B2F"; x.font="700 40px Silkscreen, 'Chakra Petch', monospace"; x.fillText("MR.MAYOR",W/2,62);
  x.fillStyle="#1B1B2F"; x.fillRect(20,80,440,440); x.drawImage(cv,0,0,112,112,24,84,432,432);
  x.font="34px Silkscreen, monospace"; for(let i=0;i<8;i++){ x.fillStyle=i<n?"#F2C230":(best?"#4A4064":"#D8CFB8"); x.fillText("★",W/2-147+i*42,568) }
  x.fillStyle=best?"#FFE680":"#1B1B2F"; x.font="700 30px 'Chakra Petch', sans-serif"; x.fillText(`${n}/8 · ${T(rk[0],rk[1]).replace(" 👑","")}${best?" 👑":""}`,W/2,612);
  if(name){ x.fillStyle=best?"#F4F4F4":"#6A6478"; x.font="600 22px 'Chakra Petch', sans-serif"; x.fillText(T(`นายกฯ ${name}`,`Mayor ${name}`),W/2,646) }
  x.fillStyle=best?"#B9AEDB":"#6A6478"; x.font="500 16px 'Chakra Petch', sans-serif"; x.fillText("SDG 11.5 · Bangkok University · 17.11.2026",W/2,688);
  return c;
}
async function saveCity(){
  const c=await cityImage(S.lbName||""), blob=await new Promise(r=>c.toBlob(r,"image/png")); if(!blob){ toast(T("สร้างรูปไม่สำเร็จ","Couldn't make the image"),"bad"); return }
  const file=new File([blob],"mr-mayor-city.png",{type:"image/png"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Mr. Mayor"}); return } }catch(e){ if(e&&e.name==="AbortError") return }
  const a=document.createElement("a"); a.href=URL_.createObjectURL(blob); a.download="mr-mayor-city.png"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL_.revokeObjectURL(a.href);a.remove()},2000);
  toast(T("บันทึกรูปเมืองแล้ว","City image saved"),"good");
}
const URL_=window.URL;

/* ---------- leaderboard (shared across devices via LB_URL, local fallback) ---------- */
const LB_URL="";   // Google Apps Script web-app URL goes here
const LB={list:null,global:false,loading:false,err:false};
const lbLocal=()=>{ try{return JSON.parse(localStorage.getItem("mm-lb")||"[]")}catch(e){return []} };
function lbSort(a){ return a.sort((p,q)=>q.stars-p.stars||q.pts-p.pts||(p.t||0)-(q.t||0)).slice(0,10) }
async function lbFetch(entry){
  LB.loading=true; LB.err=false; lbPaint();
  if(entry){ try{ const l=lbLocal(); l.push(entry); localStorage.setItem("mm-lb",JSON.stringify(lbSort(l).concat([]).slice(0,10))) }catch(e){} }
  if(LB_URL){ try{
      const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
      const r=entry?await fetch(LB_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(entry),signal:ctl.signal})
                   :await fetch(LB_URL+"?a=top&_="+Date.now(),{cache:"no-store",signal:ctl.signal});
      clearTimeout(to); const j=await r.json(); if(Array.isArray(j.top)){ LB.list=j.top; LB.global=true; LB.loading=false; lbPaint(); return } }catch(e){ LB.err=true } }
  LB.list=lbSort(lbLocal()); LB.global=false; LB.loading=false; lbPaint();
}
function lbRows(){
  if(LB.loading&&!LB.list) return `<p class="lbnote">${T("กำลังโหลด…","Loading…")}</p>`;
  if(!LB.list||!LB.list.length) return `<p class="lbnote">${T("ยังไม่มีใครส่งคะแนน เป็นคนแรกเลย!","No scores yet. Be the first!")}</p>`;
  return `<ol class="lb">${LB.list.map((e,i)=>`<li class="${e.id&&e.id===S.lbId?"me":""}"><span class="lr">${i===0?"👑":i+1}</span><span class="ln">${esc(e.name)}</span><span class="ls">${"★".repeat(Math.min(8,e.stars|0))}<small>${e.stars|0}</small></span></li>`).join("")}</ol>
    <p class="lbnote">${LB.global?T("ตารางรวมทุกเครื่อง","All devices"):T("คะแนนในเครื่องนี้","This device only")}${LB.err?T(" · เชื่อมต่อตารางรวมไม่ได้",""+" · couldn't reach the shared board"):""}</p>`;
}
function lbPaint(){ const el=$("lbbox"); if(el) el.innerHTML=lbRows() }
function lbSubmit(){
  const inp=$("lbname"); const name=(inp&&inp.value||"").replace(/[<>]/g,"").trim().slice(0,16);
  if(!name){ toast(T("ใส่ชื่อก่อนนะครับ","Type a name first"),"bad"); inp&&inp.focus(); return }
  if(S.lbId){ return }
  S.lbName=name; S.lbId=Math.random().toString(36).slice(2,10);
  const n=typeof S.result==="number"?S.result:stars();
  lbFetch({name,stars:n,pts:income()+housing(),id:S.lbId,t:Date.now(),map:S.startMap});
  const f=$("lbform"); if(f) f.innerHTML=`<p class="lbdone">${T(`ส่งคะแนนแล้ว · นายกฯ ${esc(name)}`,`Score sent · Mayor ${esc(name)}`)}</p>`;
}
function boardModal(){
  return `<div class="overlay"><div class="box modal start" role="dialog" aria-modal="true"><h3>🏆 ${T("ตารางนายกฯ","Mayor leaderboard")}</h3>
    <div id="lbbox">${lbRows()}</div><button type="button" class="primary" data-menu="back">${T("กลับ","Back")}</button></div></div>`;
}

    <div class="starrow">${[...Array(8)].map((_,i)=>`<i class="${i<n?"on":""}" style="animation-delay:${.2+i*.14}s">★</i>`).join("")}</div>

    <ul class="lessons">${lessons().map(l=>`<li>${T(l[0],l[1])}</li>`).join("")}</ul>
    <div class="debrief"><b>${T("เรื่องจริง","Real world")} · ${T(DIS[rf.k].th,DIS[rf.k].en)}:</b> ${T(rf.f[0],rf.f[1])}<br><small>${T("SDG 11.5 คือการลดความสูญเสียจากภัยพิบัติในเมือง","SDG 11.5 is about cutting city losses from disasters.")}</small></div>
    <h4 class="sumh">🏆 ${T("ตารางนายกฯ","Leaderboard")}</h4>
    <div id="lbform">${S.lbId?`<p class="lbdone">${T(`ส่งคะแนนแล้ว · นายกฯ ${esc(S.lbName)}`,`Score sent · Mayor ${esc(S.lbName)}`)}</p>`:`<div class="lbin"><input id="lbname" maxlength="16" autocomplete="off" placeholder="${T("ชื่อนายกฯ","Mayor's name")}"><button type="button" class="primary" id="lbsend">${T("ส่งคะแนน","Submit")}</button></div>`}</div>
    <div id="lbbox">${lbRows()}</div>
    <button class="primary" type="button" id="saveimg">📸 ${T("บันทึกรูปเมืองของฉัน","Save my city image")}</button>
    <div class="row2"><button class="ghostbtn" type="button" data-close="view">${T("ดูเมืองของฉัน","See my city")}</button><button class="ghostbtn" type="button" data-close="new">${T("เล่นใหม่","Play again")}</button></div></div></div>`;
}

document.addEventListener("click",e=>{
  const a=e.target.closest("button"); if(!a) return;
  if(!MUTED&&a.id!=="mute") SFX.click();
  if(a.id==="mute"){ MUTED=!MUTED; try{localStorage.setItem("mm-mute",MUTED?"1":"0")}catch(err){} if(!MUTED){ ac(); SFX.coin() } muteBtn(); return }
  if(a.dataset.tut){ if(a.dataset.tut==="skip") tutEnd(false); else { TUT.step++; tutTick() } return }
  if(a.id==="lbsend"){ lbSubmit(); return }
  if(a.id==="logbtn"){ const d=$("log"), on=!d.classList.contains("show"); d.classList.toggle("show",on); d.open=on; a.setAttribute("aria-expanded",on); return }
  if(a.id==="saveimg"){ saveCity(); return }
},true);
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target&&e.target.id==="lbname") lbSubmit() });

const SAVE_KEY="mm-save-v6";
function saveNow(){ try{ if(S&&S.round>0&&S.phase!=="over") localStorage.setItem(SAVE_KEY,JSON.stringify(S)); else localStorage.removeItem(SAVE_KEY) }catch(e){} }
function loadSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); return d&&d.v===6&&d.round>0&&d.phase!=="over"?d:null }catch(e){ return null } }
function start(data){
  let resumed=false;
  if(data&&data.state&&data.state.v===6) S=data.state;
  else { const sv=loadSave(); if(sv){ S=sv; S.modal=null; S.tool=null; S.zone=null; resumed=true } else S=fresh() }
  S.busy=false; fitCanvas(); render(); fitCanvas(); requestAnimationFrame(loop); setTimeout(fitCanvas,300); setTimeout(preloadArt,50);
  if(resumed){
    S.modal="resume"; renderModal();
  }
}
try{ window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(JSON.stringify(S))})) }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__mm={get S(){return S},place:(r,c)=>place(r,c),repair:id=>repair(id),cityImage:n=>cityImage(n),dis:(k,z)=>resolveDisaster({k,z})};
})();

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Mr. Mayor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr. Mayor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: an 8-bit city-builder cartridge. Night-blue cabinet frame; cream "dialog box" panels with hard pixel shadows.
   Left: the pixel-art district (canvas, integer-scaled). Right: council desk. Bottom: build tray. Deliberately one look in any theme. */
:root{
  --cab:#262A48; --cab-2:#1E2140; --dot:#2E3356;
  --panel:#FBF5E6; --panel-2:#F1E7CF; --ink:#1B1B2F; --muted:#6A6478;
  --grass:#5CB85C; --red:#D94A3A; --gold:#F2C230; --sky:#5FA8E8; --plum:#7A6AB0; --go:#3FAE5A; --go-dk:#2B7D3E;
  --f-pix:"Silkscreen","Chakra Petch",ui-monospace,monospace;
  --f-body:"Chakra Petch","Leelawadee UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--cab)}
body{background:var(--cab);background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);background-size:8px 8px;color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(136px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pix{font-family:var(--f-pix);letter-spacing:.02em}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);min-width:0}
.box-pad{padding:12px 14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(24px,3.4vw,34px);color:var(--panel);line-height:1;text-shadow:3px 3px 0 var(--ink),0 0 0 var(--ink)}
.brand h1 span{color:var(--gold)}
.brand p{margin:0;color:#C9C6E0;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:3px solid var(--ink);background:var(--panel);box-shadow:3px 3px 0 var(--ink);padding:5px 11px;font-weight:600;font-size:13.5px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--gold)}
.seg{display:flex}
.seg .btn{box-shadow:none;font-family:var(--f-pix);font-size:12px;padding:5px 9px}
.seg .btn+.btn{border-left:0}
.seg{box-shadow:3px 3px 0 var(--ink)}

/* status */
.status{display:grid;grid-template-columns:1.2fr 1fr 1.1fr;gap:12px}
@media (max-width:600px){.status{grid-template-columns:1fr 1fr}.status .riskbox{grid-column:1 / -1}}
.stat{padding:8px 12px;position:relative}
.stat .k{font-family:var(--f-pix);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--f-pix);font-weight:700;font-size:26px;line-height:1.15;display:flex;align-items:center;gap:8px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400}
.stat .s{font-size:12.5px;color:var(--muted)}
.coinimg{width:22px;height:22px;image-rendering:pixelated}
.track{display:flex;gap:4px;margin-top:6px}
.track .yr{display:flex;gap:2px;flex:1}
.track i{flex:1;height:8px;background:#DCD2B8;border:1px solid var(--ink)}
.track i.done{background:var(--muted)} .track i.now{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--panel)}}
.gauge{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:5px}
.gauge i{height:10px;background:#DCD2B8;border:1px solid var(--ink)}
.gauge i.on{background:var(--gold)} .gauge i.on.hi{background:var(--red)}
.float{position:absolute;right:10px;top:4px;font-family:var(--f-pix);font-weight:700;font-size:15px;animation:floatup 1.3s steps(8) forwards}
.float.up{color:var(--go)} .float.down{color:var(--red)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

/* main */
.main{display:grid;grid-template-columns:auto minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mapbox{padding:10px;justify-self:center}
.mapgrid{display:grid;grid-template-columns:18px auto;grid-template-rows:18px auto;gap:4px}
.lx,.ly{display:grid;font-family:var(--f-pix);font-size:11px;color:var(--muted);text-align:center}
.lx{align-items:end} .ly{align-items:center}
.lx span.hl,.ly span.hl{color:var(--red);font-weight:700}
#stage{position:relative;line-height:0}
#city{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid var(--ink);touch-action:manipulation;max-width:100%}
#stage.shake{animation:shake .08s steps(2) infinite}
@keyframes shake{0%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(2px,3px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:4px}
.legend{flex-direction:column;align-items:center}.legend>div{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}
.legend .zl span{display:inline-flex;align-items:center;gap:4px;color:var(--ink)} .legend .zl i{width:12px;height:12px;border:2px solid var(--ink);display:inline-block}
.zt{font-weight:700;font-size:22px;line-height:1.1}
.goal .ck{width:auto;min-width:20px;padding:0 2px;color:var(--gold)} .goal.s1 .ck,.goal.s2 .ck{background:var(--ink)}
.goal.s2 .bar i{background:repeating-linear-gradient(90deg,var(--go) 0 6px,var(--go-dk) 6px 8px)}
.goal .bar{position:relative} .goal .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.goal .gv small{font-size:11px;color:var(--muted)}
.goalnote{font-size:12.5px;color:var(--muted)} .goalnote.bad{color:var(--red);font-weight:700}
.stats3.s4{grid-template-columns:repeat(4,1fr)} .stats3.s4 b{color:var(--gold);text-shadow:1px 1px 0 var(--ink)}

.tsteps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:-4px 0 8px;font-size:11.5px;color:var(--muted)}
.tsteps i{font-style:normal;font-family:var(--f-pix);font-weight:700;font-size:12px;border:2px solid var(--ink);padding:0 5px;background:var(--panel-2);color:var(--ink)}
.tsteps i.done{text-decoration:line-through;opacity:.45}.tsteps i.now{background:var(--gold)}
.tsteps b{color:var(--ink);font-size:11px}.tsteps span{flex-basis:100%}
#splash .evsplash{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(720px,96vw)}
#splash.out .evsplash{transform:scale(.85) translateY(30px);opacity:0;transition:transform .25s ease-in,opacity .25s ease-in}
#splash .evhead{font-family:var(--f-pix);font-weight:700;font-size:18px;color:var(--panel);background:var(--ink);border:3px solid var(--panel);padding:3px 12px;animation:pop .3s ease-out both}
#splash .ecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
#splash .ecard{position:relative;will-change:transform,opacity;animation:ecdeal .45s cubic-bezier(.2,1.25,.4,1) var(--d) both}
#splash .ecard>div{border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);will-change:transform}
#splash .efront{background:var(--panel-2);padding:10px;display:flex;flex-direction:column;gap:5px;transform:scaleX(0);animation:ecfront .22s ease-out calc(var(--d) + .55s) both}
#splash .eback{position:absolute;inset:0;background:var(--cab);background-image:repeating-linear-gradient(45deg,#2E3356 0 6px,#262A48 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--panel);font-family:var(--f-pix);font-weight:700;font-size:22px;z-index:1;animation:ecback .22s ease-in calc(var(--d) + .33s) both}
#splash .eback b{color:var(--gold)} #splash .eback i{font-style:normal;font-size:13px;color:#C9C6E0}
@keyframes ecdeal{0%{transform:translateY(120px) rotate(-12deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes ecfront{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ecback{0%{transform:scaleX(1)}99%{transform:scaleX(0);opacity:1}100%{transform:scaleX(0);opacity:0;visibility:hidden}}
#splash .ecard.plus .efront{background:#E3F2D6} #splash .ecard.minus .efront{background:#F8DDD6} #splash .ecard.special .efront{background:#DDEBF7}
#splash .sk2{font-family:var(--f-pix);font-size:11px;letter-spacing:.08em;color:var(--muted)}
#splash .et{font-weight:700;font-size:22px;line-height:1.15}
#splash .eb{font-size:14px;color:var(--ink);opacity:.85;min-height:2.6em}
#splash .delta{align-self:center;display:flex;align-items:center;gap:8px;font-family:var(--f-pix);font-weight:700;font-size:28px;padding:4px 14px;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:boom .4s cubic-bezier(.2,1.4,.4,1) calc(var(--d) + .85s) both;transform:rotate(-4deg)}
#splash .delta img{width:30px;height:30px;image-rendering:pixelated}
#splash .delta.plus{background:var(--go);color:#fff;text-shadow:2px 2px 0 var(--go-dk)}
#splash .delta.minus{background:var(--red);color:#fff;text-shadow:2px 2px 0 #8E2A22;font-size:22px}
#splash .delta.special{background:var(--sky);color:#fff;text-shadow:2px 2px 0 #2F5F9E;font-size:22px}
#splash .delta.none{background:var(--panel);color:var(--muted);font-size:18px}
@keyframes boom{0%{transform:scale(2.6) rotate(-16deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
#splash .evinc{display:flex;align-items:center;gap:8px;background:var(--gold);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:5px 14px;font-weight:700;font-size:18px;animation:boom .4s cubic-bezier(.2,1.4,.4,1) var(--d) both}
#splash .evinc img{width:22px;height:22px;image-rendering:pixelated}
#splash .evsplash .skip{color:#C9C6E0;font-size:12px}
@media (max-width:560px){#splash .ecards{gap:8px}#splash .et{font-size:16px}#splash .eb{font-size:12px}#splash .delta{font-size:18px;padding:3px 8px}#splash .delta img{width:20px;height:20px}#splash .efront{padding:6px}}
.modal.intro{max-width:640px;gap:8px;padding:14px 18px}.modal.intro h3{font-size:24px}
.ihead{display:flex;align-items:center;gap:10px;font-size:20px}.ihead .inum{font-family:var(--f-pix);font-size:12px;background:var(--ink);color:var(--panel);padding:2px 7px}
.ibody{display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.5}
.ibody p{margin:0}.ibody p.sm{font-size:13px;color:var(--muted)}
.ibody img{image-rendering:pixelated}
.ig4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ig4>div{border:3px solid var(--ink);background:var(--panel-2);padding:8px;display:grid;grid-template-columns:34px 1fr;column-gap:8px;align-items:center}
.ig4 img{grid-row:span 2;width:30px;height:30px;object-fit:contain}.ig4>div>b{font-size:15px}.ig4 span{font-size:12.5px;color:var(--muted);line-height:1.3}
.ig4.zones .z-old{background:#DCC193}.ig4.zones .z-river{background:#7FD6C4}.ig4.zones .z-soft{background:#B9A36B}.ig4.zones .z-open{background:#A8D86E}.ig4.zones span{color:var(--ink)}
.bt{display:flex;flex-direction:column;gap:5px}
.bt>div{display:grid;grid-template-columns:52px 1fr;column-gap:10px;align-items:center;border:2px solid var(--ink);background:var(--panel-2);padding:3px 8px}
.bt>div>img,.bt>div>.tico4,.bt>div>.gl{grid-row:span 2;justify-self:center}
.bt>div>img{width:32px;height:32px;object-fit:contain}.bt>div>img.wide{width:48px;height:24px}.bt>div>img.tall{width:18px;height:36px}
.bt>div>b{font-size:14.5px;line-height:1.3}.bt span{font-size:12.5px;line-height:1.35}
.bt .tico4{display:grid;grid-template-columns:1fr 1fr;gap:2px}.bt .tico4 img{height:16px;width:auto;max-width:24px}
.bt .gl{font-style:normal;font-family:var(--f-pix);font-weight:700;font-size:22px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.flow li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.flow li>b{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--gold);border:3px solid var(--ink);font-family:var(--f-pix)}
.flow li>div>b{display:block}.flow li>div>span{font-size:13.5px;color:var(--ink);opacity:.85}
.exc{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);background:#F8D5CF;padding:8px}.exc img{width:30px;height:30px}.exc>div>b{display:block}.exc>div>span{font-size:13px}
.itab{border-collapse:collapse;width:100%;font-size:14px}.itab td,.itab th{border:2px solid var(--ink);padding:5px 8px}.itab th{background:var(--ink);color:var(--panel)}
.itab td:not(:first-child){text-align:center;font-family:var(--f-pix);font-weight:700}.itab img{width:18px;height:18px;vertical-align:-3px;margin-right:6px;object-fit:contain}
.ibody .rk{text-align:center;font-size:13.5px}
.idots{display:flex;justify-content:center;gap:6px}.idots button{width:12px;height:12px;padding:0;border:2px solid var(--ink);background:var(--panel)}.idots button.on{background:var(--gold)}
.inav{display:grid;grid-template-columns:1fr 2fr;gap:10px}.inav .primary{padding:11px}
@media (max-width:520px){.ig4{grid-template-columns:1fr}.ihead{font-size:17px}}
.modal.start{max-width:460px;align-items:stretch;text-align:center}
.startart{border:3px solid var(--ink);line-height:0}.startart img{width:100%;aspect-ratio:64/36;image-rendering:pixelated}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.langpick button{border:3px solid var(--ink);background:var(--panel-2);box-shadow:4px 4px 0 var(--ink);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.langpick button b{font-size:24px}.langpick button span{font-size:13px;color:var(--muted)}
.langpick button:hover,.langpick button:focus-visible{background:var(--gold)}
.langpick button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.menu{display:flex;flex-direction:column;gap:10px}.menu .primary small{display:block;font-size:12px;font-weight:500;text-shadow:none;opacity:.9}
.langsw{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
/* desk */
.desk{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.head h2{margin:0;font-size:18px;font-weight:700}
.tagk{font-family:var(--f-pix);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--panel);background:var(--ink);padding:2px 6px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (max-width:440px){.cards{grid-template-columns:1fr}}
.card{border:3px solid var(--ink);background:var(--panel-2);padding:9px 10px;min-height:112px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;box-shadow:3px 3px 0 var(--ink)}
.card .ck{font-family:var(--f-pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .t{font-weight:700;font-size:16px;line-height:1.25;text-wrap:balance}
.card .b{font-size:13.5px;color:var(--muted)}
.card.plus{background:#E3F2D6} .card.minus{background:#F8DDD6} .card.special{background:#DDEBF7}
.card.dis{background:#F8D5CF} .card.blocked{background:#DDF1DF} .card.loc{background:var(--panel)}
.card.empty{align-items:center;justify-content:center;text-align:center;color:var(--muted);border-style:dashed;background:transparent;box-shadow:none;font-size:13px}
.card .real{font-size:12px;color:var(--muted);border-top:2px dotted var(--ink);padding-top:4px;margin-top:3px}
.card .icon{width:auto;height:28px;max-width:44px;image-rendering:pixelated}
.deal{animation:deal .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes deal{0%{transform:translateY(40px) rotate(-8deg) scale(.85);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.flip{animation:flip .5s ease-out both}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:none}}
.cellcode{font-family:var(--f-pix);font-weight:700;font-size:38px;line-height:1}
.card:not(.empty){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:1px;align-content:start;min-height:0}
.card:not(.empty)>*{grid-column:2}
.card>.cart,.card>.cartw{grid-column:1;grid-row:1 / span 5;align-self:start}
.card .cart{width:128px;height:72px;object-fit:contain;image-rendering:pixelated;border:2px solid var(--ink);display:block;background:#CDEBFA}
.card .cartw .cart{width:128px}
.card.empty{min-height:56px}
@media (max-width:420px){.card .cart,.card .cartw .cart{width:104px;height:58.5px}}
.card .cartw{position:relative}.card .cstamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(221,241,223,.55)}
.card .cstamp img{height:40px;width:auto;image-rendering:pixelated;animation:got .5s steps(4)}
.card.deal .cart{animation:artin .6s steps(6) both;animation-delay:inherit}
@keyframes artin{0%{filter:brightness(2.2) saturate(0)}100%{filter:none}}
.zbar{display:grid;gap:0;margin:4px 0}
.zbar>i{display:block}
.zb{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);padding:3px 6px;min-width:0;box-shadow:2px 2px 0 var(--ink);margin:0 2px}
.zb img{width:22px;height:22px;image-rendering:pixelated;flex:none}.zb img.own{width:14px;height:14px;vertical-align:-2px}
.zb b{display:block;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb span{display:block;font-size:11px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb.z-old{background:repeating-linear-gradient(0deg,#DCC193 0 6px,#C9A97A 6px 8px)}
.zb.z-river{background:repeating-linear-gradient(90deg,#7FD6C4 0 8px,#5FBFAE 8px 10px)}
.zb.z-soft{background:radial-gradient(#8C7744 1px,transparent 1.5px) 0 0/6px 6px,#B9A36B}
.zb.z-open{background:radial-gradient(#F2C230 1px,transparent 1.5px) 0 0/9px 9px,#A8D86E}
.zb.hit{animation:zhit .5s steps(2) 4;outline:3px solid var(--red)}
@media (max-width:640px){.zb span{display:none}.zb b{font-size:12px}.zb img{width:16px;height:16px}.zb{padding:2px 4px;gap:4px}}
@keyframes zhit{50%{transform:translateY(-3px);filter:brightness(1.25)}}
.tray .h2{display:none}
.hinfo{font-size:12.5px;line-height:1.5;margin:6px 2px 0;min-height:38px;color:var(--ink)}
.hinfo .th{display:inline-flex;align-items:center;gap:3px;border:2px solid var(--ink);padding:0 5px;margin:1px 2px;background:#F8D5CF;font-weight:700}
.hinfo .th.safe{background:#CDEBC9}.hinfo .th small{font-weight:500}
.hinfo img{width:14px;height:14px;image-rendering:pixelated}
.hinfo .zn.z-old{background:#DCC193}.hinfo .zn.z-river{background:#7FD6C4}.hinfo .zn.z-soft{background:#B9A36B}.hinfo .zn.z-open{background:#A8D86E}.hinfo .zn{padding:0 4px;border:2px solid var(--ink)}
#splash{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
#splash.show,#splash.out{display:flex}
#splash .sp-bg{position:absolute;inset:0;background:rgba(14,15,34,.55);animation:fadein .2s steps(3)}
#splash.out .sp-bg{opacity:0;transition:opacity .25s}

  soft:{r:[4,6],c:[0,2],hz:"quake",th:"ดินอ่อน",en:"Soft Ground",col:"#A08A55"},open:{r:[4,6],c:[4,6],hz:"storm",th:"ที่โล่ง",en:"Open Plain",col:"#7CC45A"}};

function startRound(){

function applyEvent(k){
  const e=EV[k], f=count("factory"), fo=count("factory",1); let d=0;
  switch(k){
    case "tourism": d=count("shop",1); break;
    case "investor": d=f?2+fo:0; break;
    case "grant": d=4; break; case "tax": d=3; break;
    case "wastewater": d=-2*f; break; case "road": d=-3; break;
    case "power": d=-(count("shop")+f); break;
    case "parkdemand": d=count("green")<f?-3:0; break;
    case "forecast": S.pending.push("forecast"); break;
    case "drill": S.mod.noroll=true; break;
    case "volunteers": S.mod.freerepair=(S.mod.freerepair||0)+1; break;
    case "material": S.mod.buildcost=(S.mod.buildcost||0)+2; break;
    case "totemsale": S.mod.totemdisc=(S.mod.totemdisc||0)+3; break;
    case "movein": S.mod.freehouse=(S.mod.freehouse||0)+1; break;
    case "strike": S.mod.nofac=true; break;
    case "holiday": S.mod.noshop=true; break;
    case "tide": S.mod.riskup=(S.mod.riskup||0)+2; break;
  }
  if(d) S.coins=Math.max(0,S.coins+d);
  log(`${e.th}${d?` (${d>0?"+":""}${d})`:""}`,`${e.en}${d?` (${d>0?"+":""}${d})`:""}`,d>0?"good":d<0?"bad":"");
  return d;
}
function nextStep(){

  else S.phase="roll";

}

/* build */
const priceOf=t=>(t==="house"&&S.mod.freehouse)?0:PRICE[t]+(S.mod.buildcost||0);
const totemPrice=()=>Math.max(0,TOTEM_STEPS[Math.min(3,S.totems.length)]-(S.mod.totemdisc||0));
function cellsFor(t,r,c,o){ return SIZE[t]?(o==="h"?[[r,c],[r,c+1]]:[[r,c],[r+1,c]]):[[r,c]] }
function fits(t,r,c,o){ const m=occ(); return cellsFor(t,r,c,o).every(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!isRoad(a,b)&&!m[a+","+b]) }
function nearHome(t,r,c,o){ if(!NEEDS_HOME[t]) return true; const cs=cellsFor(t,r,c,o);
  return S.pieces.some(p=>(p.type==="house"||p.type==="condo")&&p.cells.some(a=>cs.some(b=>side(a,b)))) }
function canPlace(t,r,c,o){ return fits(t,r,c,o)&&nearHome(t,r,c,o) }
function anySpot(t){ for(const [r,c] of LOTS) for(const o of SIZE[t]?["h","v"]:["h"]) if(canPlace(t,r,c,o)) return true; return false }
function why(t){
  if(S.phase!=="build"||S.busy) return T("รอช่วงบริหารเมือง","Wait for the build phase");
  if(S.coins<priceOf(t)) return T("เงินไม่พอ","Not enough coins");
  if(NEEDS_HOME[t]&&!anySpot(t)) return T("ไม่มีช่องว่างที่ติดบ้านหรือคอนโด","No free lot next to a house or apartment block");
  return "";
}
function place(r,c){

  const p={id:S.nextId++,type:t,cells:cellsFor(t,r,c,S.orient),dmg:false,rf:false}; S.pieces.push(p); S.coins-=cost; bump(-cost); FX.build(p);
  if(free) S.mod.freehouse--;
  if(t==="factory"){ S.ff++; if(S.disDeck.length){S.disDeck.splice(rnd(S.disDeck.length+1),0,{k:"ffire"})} }
  S.undo.push({kind:"piece",id:p.id,cost,free});
  log(`สร้าง${nm(t)} ที่ ${code(r,c)}${cost?` (−${cost})`:" (ฟรี)"}`,`Built ${nm(t).toLowerCase()} at ${code(r,c)}${cost?` (−${cost})`:" (free)"}`);
  if(why(t)) S.tool=null; render();
}
let gotTotem=null;
function buyTotem(k){
  if(S.phase!=="build"||S.busy||S.totems.includes(k)||S.coins<totemPrice()) return;
  const cost=totemPrice(); S.coins-=cost; bump(-cost); S.totems.push(k); S.undo.push({kind:"totem",k,cost}); gotTotem=k; FX.shieldSmall();
  log(`ซื้อ Totem ${TOTEM[k][0]} (−${cost})`,`Bought the ${TOTEM[k][1]} Totem (−${cost})`); render();
}
function repair(id){
  const p=S.pieces.find(x=>x.id===id); if(!p||!p.dmg) return;
  const free=(S.mod.freerepair||0)>0, cost=free?0:PRICE[p.type];
  if(S.coins<cost){toast(T("เงินไม่พอซ่อม","Not enough coins to repair"),"bad");return}

  S.undo.push({kind:"repair",id,cost,free}); log(`ซ่อม${nm(p.type)}${cost?` (−${cost})`:" (ฟรี)"}`,`Repaired ${nm(p.type).toLowerCase()}${cost?` (−${cost})`:" (free)"}`);

const canRF=p=>p&&p.type!=="green"&&!p.dmg&&!p.rf;
function reinforce(id){

function demolish(id){
  const p=S.pieces.find(x=>x.id===id); if(!p) return;

function undo(){
  const u=S.undo.pop(); if(!u) return;
  if(u.kind==="piece"){ const p=S.pieces.find(x=>x.id===u.id); S.pieces=S.pieces.filter(x=>x.id!==u.id);
    if(p&&p.type==="factory"){ S.ff--; let i=-1; S.disDeck.forEach((c,j)=>{if(c.k==="ffire")i=j}); if(i>=0) S.disDeck.splice(i,1) }
    if(u.free) S.mod.freehouse=(S.mod.freehouse||0)+1 }
  if(u.kind==="totem") S.totems=S.totems.filter(t=>t!==u.k);
  if(u.kind==="repair"){ const p=S.pieces.find(x=>x.id===u.id); if(p) p.dmg=true; if(u.free) S.mod.freerepair=(S.mod.freerepair||0)+1 }

  if(u.kind==="demolish"){ S.pieces.splice(u.idx,0,u.piece); if(u.piece.type==="factory"){ S.ff++; if(u.ffCard) S.disDeck.splice(rnd(S.disDeck.length+1),0,{k:"ffire"}) } }

}

}

  if(S.pieces.some(p=>p.type==="factory"&&S.pieces.some(q=>q!==p&&q.type!=="green"&&touches(p,q)))&&!S.totems.includes("fire")&&S.round<=9)

/* ======================= EVENTS ======================= */
function startTip(){ const L=START_MAPS.find(m=>m.id===S.startMap); const z=L?L.z:null;
  return z?T(`เมืองคุณเริ่มที่${ZONES[z].th} (ผัง #${L.id}) · พร้อมแล้วกด ▶ เริ่มวาระ`,`Your town starts in ${ZONES[z].en} (map #${L.id}) · press ▶ Start your term`):T("พร้อมเมื่อไร กด ▶ เริ่มวาระ ที่มุมขวาล่าง","Ready? Press ▶ Start your term") }
function newGame(){ PREV=null; S=fresh(); S.modal="menu"; effects=[]; parts=[]; dmgShow.clear(); drops.clear(); render() }
document.addEventListener("click",e=>{
  if(splashDone&&e.target.closest("#splash")){ splashDone(); return }
  const a=e.target.closest("button"); if(!a) return;
  if(a.id==="act"&&!S.busy){ if(S.phase==="ready") startRound(); else if(S.phase==="roll") rollRisk(); else if(S.phase==="build") endRound(); else if(S.phase==="over") newGame(); return }
  if(a.dataset.fc){ forecastChoice(a.dataset.fc==="keep"); return }
  if(a.dataset.buy){ const w=why(a.dataset.buy); if(w&&S.tool!==a.dataset.buy){ toast(`${nm(a.dataset.buy)}: ${w}`,"bad"); return } S.tool=S.tool===a.dataset.buy?null:a.dataset.buy; render(); return }
  if(a.dataset.totem){ buyTotem(a.dataset.totem); return }
  if(a.id==="rotate"){ S.orient=S.orient==="h"?"v":"h"; render(); return }
  if(a.id==="demolish"){ S.tool=S.tool==="demolish"?null:"demolish"; render(); return }
  if(a.id==="reinforce"){ S.tool=S.tool==="reinforce"?null:"reinforce"; render(); return }
  if(a.id==="repair"){ S.tool=S.tool==="repair"?null:"repair"; render(); return }
  if(a.id==="undo"){ undo(); return }
  if(a.id==="newgame"){ newGame(); return }
  if(a.dataset.pick){ lang=a.dataset.pick; try{localStorage.setItem("mm4-lang",lang)}catch(err){} S.modal="menu"; render(); return }
  if(a.dataset.menu){ const m=a.dataset.menu;
    if(m==="lang"){ lang=lang==="th"?"en":"th"; try{localStorage.setItem("mm4-lang",lang)}catch(err){} render(); return }
    if(m==="rules"){ introPage=0; S.modal="intro"; render(); return }
    if(m==="play"){ S.modal=null; render(); setTimeout(()=>toast(startTip()),250); return } }
  if(a.dataset.ipage!==undefined){ if(document.querySelector("#overlay .modal.intro")) showIntroPage(+a.dataset.ipage); else { introPage=+a.dataset.ipage; renderModal() } return }
  if(a.id==="help"){ if(S.phase!=="over"){introPage=0;S.modal="intro"; renderModal()} return }
  if(a.id==="lang-th"||a.id==="lang-en"){ lang=a.id==="lang-th"?"th":"en"; try{localStorage.setItem("mm4-lang",lang)}catch(err){} render(); return }
  if(a.dataset.close){ const k=a.dataset.close; S.modal=null; if(k==="new"){ newGame(); S.modal=null; startRound(); return } if(k==="intro"&&S.round===0){ render(); setTimeout(()=>toast(startTip()),250); return } render(); return }
});
document.addEventListener("keydown",e=>{ if((e.key==="r"||e.key==="R")&&SIZE[S.tool]){S.orient=S.orient==="h"?"v":"h"; render()} });

function preloadArt(){
  const urls=[...Object.keys(EV),...Object.keys(DIS)].map(k=>art(k)).concat(Object.values(TURL),Object.values(URL));
  let i=0; const step=()=>{ const t0=performance.now(); while(i<urls.length&&performance.now()-t0<8){ const im=new Image(); im.src=urls[i++]; if(im.decode) im.decode().catch(()=>{}) } if(i<urls.length) setTimeout(step,16) }; step();
}
function start(data){ S=(data&&data.state&&data.state.v===5)?data.state:fresh(); S.busy=false; fitCanvas(); render(); fitCanvas(); requestAnimationFrame(loop); setTimeout(fitCanvas,300); setTimeout(preloadArt,50) }
try{ window.claude?.hot?.snapshot?.(()=>({state:JSON.parse(JSON.stringify(S))})) }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__mm={get S(){return S},place:(r,c)=>place(r,c),repair:id=>repair(id)};
})();
</script>

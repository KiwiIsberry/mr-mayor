<style>
/* Layout: an 8-bit city-builder cartridge. Night-blue cabinet frame; cream "dialog box" panels with hard pixel shadows.
   Left: the pixel-art district (canvas, integer-scaled). Right: council desk. Bottom: build tray. Deliberately one look in any theme. */
:root{
  --cab:#262A48; --cab-2:#1E2140; --dot:#2E3356;
  --panel:#FBF5E6; --panel-2:#F1E7CF; --ink:#1B1B2F; --muted:#6A6478;
  --grass:#5CB85C; --red:#D94A3A; --gold:#F2C230; --sky:#5FA8E8; --plum:#7A6AB0; --go:#3FAE5A; --go-dk:#2B7D3E;
  --f-pix:"Silkscreen","Chakra Petch",ui-monospace,monospace;
  --f-body:"Chakra Petch","Leelawadee UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--cab)}
body{background:var(--cab);background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);background-size:8px 8px;color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(136px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pix{font-family:var(--f-pix);letter-spacing:.02em}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);min-width:0}
.box-pad{padding:12px 14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(24px,3.4vw,34px);color:var(--panel);line-height:1;text-shadow:3px 3px 0 var(--ink),0 0 0 var(--ink)}
.brand h1 span{color:var(--gold)}
.brand p{margin:0;color:#C9C6E0;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:3px solid var(--ink);background:var(--panel);box-shadow:3px 3px 0 var(--ink);padding:5px 11px;font-weight:600;font-size:13.5px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--gold)}
.seg{display:flex}
.seg .btn{box-shadow:none;font-family:var(--f-pix);font-size:12px;padding:5px 9px}
.seg .btn+.btn{border-left:0}
.seg{box-shadow:3px 3px 0 var(--ink)}

/* status */
.status{display:grid;grid-template-columns:1.2fr 1fr 1.1fr;gap:12px}
@media (max-width:600px){.status{grid-template-columns:1fr 1fr}.status .riskbox{grid-column:1 / -1}}
.stat{padding:8px 12px;position:relative}
.stat .k{font-family:var(--f-pix);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--f-pix);font-weight:700;font-size:26px;line-height:1.15;display:flex;align-items:center;gap:8px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400}
.stat .s{font-size:12.5px;color:var(--muted)}
.coinimg{width:22px;height:22px;image-rendering:pixelated}
.track{display:flex;gap:4px;margin-top:6px}
.track .yr{display:flex;gap:2px;flex:1}
.track i{flex:1;height:8px;background:#DCD2B8;border:1px solid var(--ink)}
.track i.done{background:var(--muted)} .track i.now{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--panel)}}
.gauge{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:5px}
.gauge i{height:10px;background:#DCD2B8;border:1px solid var(--ink)}
.gauge i.on{background:var(--gold)} .gauge i.on.hi{background:var(--red)}
.float{position:absolute;right:10px;top:4px;font-family:var(--f-pix);font-weight:700;font-size:15px;animation:floatup 1.3s steps(8) forwards}
.float.up{color:var(--go)} .float.down{color:var(--red)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

/* main */
.main{display:grid;grid-template-columns:auto minmax(330px,1fr);gap:16px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mapbox{padding:10px;justify-self:center}
.mapgrid{display:grid;grid-template-columns:18px auto;grid-template-rows:18px auto;gap:4px}
.lx,.ly{display:grid;font-family:var(--f-pix);font-size:11px;color:var(--muted);text-align:center}
.lx{align-items:end} .ly{align-items:center}
.lx span.hl,.ly span.hl{color:var(--red);font-weight:700}
#stage{position:relative;line-height:0}
#city{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:3px solid var(--ink);touch-action:manipulation;max-width:100%}
#stage.shake{animation:shake .08s steps(2) infinite}
@keyframes shake{0%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(2px,3px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:4px}
.legend{flex-direction:column;align-items:center}.legend>div{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}
.legend .zl span{display:inline-flex;align-items:center;gap:4px;color:var(--ink)} .legend .zl i{width:12px;height:12px;border:2px solid var(--ink);display:inline-block}
.zt{font-weight:700;font-size:22px;line-height:1.1}
.goal .ck{width:auto;min-width:20px;padding:0 2px;color:var(--gold)} .goal.s1 .ck,.goal.s2 .ck{background:var(--ink)}
.goal.s2 .bar i{background:repeating-linear-gradient(90deg,var(--go) 0 6px,var(--go-dk) 6px 8px)}
.goal .bar{position:relative} .goal .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.goal .gv small{font-size:11px;color:var(--muted)}
.goalnote{font-size:12.5px;color:var(--muted)} .goalnote.bad{color:var(--red);font-weight:700}
.stats3.s4{grid-template-columns:repeat(4,1fr)} .stats3.s4 b{color:var(--gold);text-shadow:1px 1px 0 var(--ink)}

.tsteps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:-4px 0 8px;font-size:11.5px;color:var(--muted)}
.tsteps i{font-style:normal;font-family:var(--f-pix);font-weight:700;font-size:12px;border:2px solid var(--ink);padding:0 5px;background:var(--panel-2);color:var(--ink)}
.tsteps i.done{text-decoration:line-through;opacity:.45}.tsteps i.now{background:var(--gold)}
.tsteps b{color:var(--ink);font-size:11px}.tsteps span{flex-basis:100%}
#splash .evsplash{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(720px,96vw)}
#splash.out .evsplash{transform:scale(.85) translateY(30px);opacity:0;transition:transform .25s ease-in,opacity .25s ease-in}
#splash .evhead{font-family:var(--f-pix);font-weight:700;font-size:18px;color:var(--panel);background:var(--ink);border:3px solid var(--panel);padding:3px 12px;animation:pop .3s ease-out both}
#splash .ecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}
#splash .ecard{position:relative;will-change:transform,opacity;animation:ecdeal .45s cubic-bezier(.2,1.25,.4,1) var(--d) both}
#splash .ecard>div{border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);will-change:transform}
#splash .efront{background:var(--panel-2);padding:10px;display:flex;flex-direction:column;gap:5px;transform:scaleX(0);animation:ecfront .22s ease-out calc(var(--d) + .55s) both}
#splash .eback{position:absolute;inset:0;background:var(--cab);background-image:repeating-linear-gradient(45deg,#2E3356 0 6px,#262A48 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--panel);font-family:var(--f-pix);font-weight:700;font-size:22px;z-index:1;animation:ecback .22s ease-in calc(var(--d) + .33s) both}
#splash .eback b{color:var(--gold)} #splash .eback i{font-style:normal;font-size:13px;color:#C9C6E0}
@keyframes ecdeal{0%{transform:translateY(120px) rotate(-12deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes ecfront{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes ecback{0%{transform:scaleX(1)}99%{transform:scaleX(0);opacity:1}100%{transform:scaleX(0);opacity:0;visibility:hidden}}
#splash .ecard.plus .efront{background:#E3F2D6} #splash .ecard.minus .efront{background:#F8DDD6} #splash .ecard.special .efront{background:#DDEBF7}
#splash .sk2{font-family:var(--f-pix);font-size:11px;letter-spacing:.08em;color:var(--muted)}
#splash .et{font-weight:700;font-size:22px;line-height:1.15}

function applyEvent(k){
  const e=EV[k], f=count("factory"), fo=count("factory",1); let d=0;
  switch(k){
    case "tourism": d=count("shop",1); break;
    case "investor": d=fo?2+fo:0; break;
    case "grant": d=4; break; case "tax": d=3; break;
    case "wastewater": d=-2*f; break; case "road": d=-3; break;
    case "power": d=-(count("shop")+f); break;
    case "parkdemand": d=count("green")<f?-3:0; break;
    case "drill": S.mod.noroll=true; break;
    case "volunteers": S.mod.freerepair=(S.mod.freerepair||0)+1; break;
    case "material": S.mod.buildcost=(S.mod.buildcost||0)+2; break;
    case "totemsale": S.mod.totemdisc=(S.mod.totemdisc||0)+3; break;
    case "movein": S.mod.freehouse=(S.mod.freehouse||0)+1; break;
    case "strike": S.mod.nofac=true; break;
    case "holiday": S.mod.noshop=true; break;
    case "tide": S.mod.riskup=(S.mod.riskup||0)+2; break;
  }
  if(d) S.coins=Math.max(0,S.coins+d);
  log(`${e.th}${d?` (${d>0?"+":""}${d})`:""}`,`${e.en}${d?` (${d>0?"+":""}${d})`:""}`,d>0?"good":d<0?"bad":"");
  return d;
}

function onTap(fn){ splashDone=()=>{ splashDone=null; fn() } }
const wait=ms=>new Promise(r=>setTimeout(r,reduce()?0:ms));
function deckHTML(kind,n){ const back=kind==="dis"?`<span>${pi("warn")}<b>${T("ภัยพิบัติ","DISASTER")}</b></span>`:`<span>MR.<b>MAYOR</b></span>`;
  return `<div class="edeck ${kind==="dis"?"red":""}">${[...Array(n)].map((_,i)=>`<i class="dk${i}">${back}</i>`).join("")}</div>` }
/* move an element from where it is on the overlay to a target rect on the page, then fade it out */
function flyTo(el,target,ms){ if(!el||!target||reduce()) return; const a=el.getBoundingClientRect(), b=target.getBoundingClientRect(); if(!a.width||!b.width) return;
  const s=Math.min(b.width/a.width,b.height/a.height), dx=b.left+b.width/2-(a.left+a.width/2), dy=b.top+b.height/2-(a.top+a.height/2);
  el.style.transition=`transform ${ms}ms cubic-bezier(.5,0,.3,1), opacity ${ms*.45}ms ease-in ${ms*.55}ms`; el.style.transformOrigin="center"; el.style.animation="none";
  requestAnimationFrame(()=>{ el.style.transform=`translate(${dx}px,${dy}px) scale(${s})`; el.style.opacity="0" }) }

/* ---------- 1. events ---------- */
function startRound(){
  S.round++; S.mod={}; S.events=[]; S.disCard=null; S.blocked=false; S.zone=null; S.dice=null; S.hits=[]; S.saved=[]; S.undo=[]; S.tool=null; S.msg=null; S.pending=[]; S.deal++;

}
function promptDraw(){
  const ov=ovOpen(`<div class="evsplash"><div class="evhead">${T(`รอบ ${S.round} · ปีที่ ${year(S.round)}`,`Round ${S.round} · Year ${year(S.round)}`)}</div>
    <div class="ovtitle">${T("จั่วการ์ดเหตุการณ์","Draw the event cards")}</div>
    ${pcap("draw")}${deckHTML("ev",4)}<div class="ecards"></div><div class="evfoot"></div>
    <div class="taphint">${T("แตะที่ไหนก็ได้เพื่อจั่ว","Tap anywhere to draw")}</div></div>`,"wait");
  onTap(()=>dealEvents(ov));
}
function dealEvents(ov){
  const c0=S.coins, keys=[], ds=[]; for(let i=0;i<2;i++){ const k=drawEvent(); S.events.push(k); ds.push(applyEvent(k)) }
  const inc=income(S.mod.noshop,S.mod.nofac); S.coins+=inc; log(`รอบ ${S.round} · รายได้ +${inc}`,`Round ${S.round} · income +${inc}`);
  S.phase="events"; S.busy=false; saveNow(); S.busy=true; const dCoins=S.coins-c0;
  const D0=.15, GAP=2.0, dealt=D0+GAP+1.3;
  const badge=(k,d)=>{const e=EV[k]; if(d) return `<div class="delta ${d>0?"plus":"minus"}">${img("coin")}${d>0?"+":"−"}${Math.abs(d)} ${T("เหรียญ","coins")}</div>`;
    if(e.cls==="special") return `<div class="delta special">${pi("star")} ${T("พิเศษ","SPECIAL")}</div>`;
    if(k==="movein") return `<div class="delta plus">${img("house")}${T("บ้านฟรี","FREE HOUSE")}</div>`;
    if(["strike","holiday","material","tide"].includes(k)) return `<div class="delta minus">${pi("warn")} ${T("รอบนี้","THIS ROUND")}</div>`;
    return `<div class="delta none">${T("รอดไป ไม่มีผล","NO EFFECT")}</div>`};
  ov.classList.remove("wait"); ov.querySelector(".ovtitle").classList.add("gone");
  const dk=ov.querySelectorAll(".edeck i"); dk[3].style.setProperty("--d",D0+"s"); dk[2].style.setProperty("--d",(D0+GAP)+"s"); dk[3].classList.add("off"); dk[2].classList.add("off");
  ov.querySelector(".ecards").innerHTML=S.events.map((k,i)=>{const e=EV[k];return `<div class="ecard ${e.cls}" style="--d:${D0+i*GAP}s;--fx:${i===0?"calc(50% + 8px)":"calc(-50% - 8px)"};--fr:${i===0?-9:7}deg"><div class="eback"><span>MR.<b>MAYOR</b></span><i>${T("เหตุการณ์","EVENT")}</i></div><div class="efront"><div class="sk2">${T("เหตุการณ์","EVENT")}</div><img class="sart" src="${art(k)}" alt=""><div class="et">${T(e.th,e.en)}</div><div class="eb">${T(e.b[0],e.b[1])}</div>${badge(k,ds[i])}</div></div>`}).join("");
  ov.querySelector(".evfoot").innerHTML=`<div class="evinc" style="--d:${D0+GAP+1.2}s">${img("coin")}${T(`รายได้จากเมือง +${inc}`,`City income +${inc}`)}</div>`;
  ov.querySelector(".taphint").textContent=T("แตะเพื่อดูการ์ดทั้งหมด","Tap to reveal both cards");
  SFX.cards(2,D0,GAP);
  let fast=false, auto=null; const t0=performance.now();
  const finish=()=>{ clearTimeout(auto); onTap(()=>{}); eventsToDesk(ov,inc,dCoins) };
  const ready=()=>{ ov.querySelector(".taphint").textContent=T("แตะเพื่อไปต่อ","Tap to continue"); onTap(finish); auto=setTimeout(finish,6000) };
  const rt=setTimeout(ready,reduce()?0:dealt*1000);
  onTap(()=>{ if(!fast&&performance.now()-t0<dealt*1000){ fast=true; OV().classList.add("fast"); clearTimeout(rt); setTimeout(ready,300) } });
}
async function eventsToDesk(ov,inc,dCoins){
  lastDeal=S.deal; S.busy=false; renderDesk(); S.busy=true;
  const targets=[...$("desk").querySelectorAll(".cards .card")].slice(0,2);
  targets.forEach(t=>t.style.visibility="hidden");
  ov.querySelectorAll(".ecard").forEach((c,i)=>flyTo(c,targets[i],650));
  flyTo(ov.querySelector(".evinc"),document.querySelector("#status .stat:nth-child(2)"),650);
  ov.querySelector(".edeck").classList.add("leave"); ov.querySelector(".taphint").style.opacity=0; OV().classList.add("dim");
  await wait(680);
  targets.forEach(t=>t.style.visibility="");
  ovClose(); bump(dCoins); FX.coins(inc); toast(T(`รอบ ${S.round} · รายได้ +${inc}`,`Round ${S.round} · income +${inc}`));
  nextStep();
}
function nextStep(){
  if(S.round===1){ S.phase="build"; S.msg={th:"รอบแรกยังไม่ต้องทอยความเสี่ยง วางรากฐานเมืองก่อน",en:"No risk roll in round 1. Build your foundations."} }
  else if(S.mod.noroll){ S.phase="build"; S.msg={th:"ซ้อมอพยพ: รอบนี้ไม่ต้องทอยความเสี่ยง",en:"Evacuation drill: no risk roll this round."} }
  else { S.phase="roll"; S.busy=false; saveNow(); promptRoll(); return }
  S.busy=false; render();
}

/* ---------- 2. risk dice ---------- */
function rollRisk(){ promptRoll() }
function promptRoll(){
  const r=risk(), pc=chance(r);
  const ov=ovOpen(`<div class="rollbox"><div class="evhead">${T(`รอบ ${S.round} · ปีที่ ${year(S.round)}`,`Round ${S.round} · Year ${year(S.round)}`)}</div>
    <div class="ovtitle">${T("ทอยลูกเต๋าความเสี่ยง","Roll the risk dice")}</div>
    <div class="rrule">${T(`ทอย 2 ลูก ได้ <b>${r} หรือน้อยกว่า</b> = เกิดภัย`,`Roll 2 dice: <b>${r} or less</b> = disaster`)}<br><small>${riskWhy(S.round)}</small></div>
    <div class="rchance"><span>${T("โอกาสเกิดภัย","Disaster chance")}</span><b>${pc}%</b><i><u style="width:${pc}%"></u></i></div>
    ${pcap("roll")}<div class="dice big">${dieHTML(3)}${dieHTML(4)}</div><div class="rverdict"></div>
    <div class="taphint">${T("แตะที่ไหนก็ได้เพื่อทอย","Tap anywhere to roll")}</div></div>`,"wait");
  onTap(()=>doRoll(ov,r));
}
async function doRoll(ov,r){
  ov.classList.remove("wait"); ov.querySelector(".taphint").style.opacity=0;
  const rg=S.practice&&PRACTICE.dice[S.round], a=rg?rg[0]:1+rnd(6), b=rg?rg[1]:1+rnd(6), hit=a+b<=r; S.dice=[a,b];
  if(hit){ log(`ทอยได้ ${a+b} ≤ ${r}: เกิดภัย`,`Rolled ${a+b} ≤ ${r}: disaster`,"bad"); S.phase="disdraw" }
  else { log(`ทอยได้ ${a+b} > ${r}: ปลอดภัย`,`Rolled ${a+b} > ${r}: safe`,"good"); S.phase="build" }
  S.busy=false; saveNow(); S.busy=true;            // result is fixed before any animation
  const box=ov.querySelector(".dice");
  for(let i=0;i<(reduce()?0:12);i++){ box.innerHTML=dieHTML(1+rnd(6),1)+dieHTML(1+rnd(6),1); SFX.dice(); await wait(85) }
  box.innerHTML=dieHTML(a,0,1)+dieHTML(b,0,1); SFX.hit("quake",true);
  const v=ov.querySelector(".rverdict"); v.className="rverdict "+(hit?"hit":"safe");
  v.innerHTML=hit?T(`${a+b} ≤ ${r} · เกิดภัย!`,`${a+b} ≤ ${r} · DISASTER!`):T(`${a+b} > ${r} · ปลอดภัย`,`${a+b} > ${r} · SAFE`);
  if(hit) SFX.alarm(); else SFX.good();
  await wait(1500);
  lastDeal=S.deal; S.busy=false; renderDesk(); S.busy=true;
  const tgt=document.querySelector("#desk .dice"); if(tgt) tgt.style.visibility="hidden";
  flyTo(box,tgt,600); v.style.transition="opacity .3s"; v.style.opacity=0; ov.querySelector(".rchance").style.opacity=0;
  await wait(620); if(tgt) tgt.style.visibility="";
  if(hit){ ovClose(); promptDisDraw() } else { ovClose(); S.busy=false; S.msg={th:"รอดไป รอบนี้ไม่เกิดภัย",en:"Safe! No disaster this round."}; render(); toast(T(`ทอยได้ ${a+b} · ปลอดภัย`,`Rolled ${a+b} · safe`),"good") }
}

/* ---------- 3. disaster card ---------- */
function promptDisDraw(){
  if(!S.disDeck.length) refillDis();
  const ov=ovOpen(`<div class="disbox"><div class="ovtitle red">${T("จั่วการ์ดภัยพิบัติ","Draw a disaster card")}</div>${pcap("dis")}

  onTap(()=>drawDisaster(ov));
}
async function drawDisaster(ov){
  if(!ov){ promptDisDraw(); return }
  const card=drawDis(); S.phase="strike"; S.curDis=card; S.busy=false; saveNow(); S.busy=true;
  const k=card.k, d=DIS[k], blocked=S.totems.includes(TOTEM_OF[k]);
  ov.classList.remove("wait"); ov.querySelector(".taphint").style.opacity=0; ov.querySelector(".ovtitle").classList.add("gone");
  ov.querySelector(".edeck i:last-child").classList.add("off");
  const zh=k==="ffire"?T("สุ่มโรงงาน 1 แห่ง · พังพร้อมอาคารที่ติดกัน","A random factory and everything touching it"):`<b>${zoneName(card.z)}</b> · ${HAZ[k].hits.map(t=>`<span style="white-space:nowrap">${img(t)}${nm(t)}</span>`).join(" ")}`;
  ov.querySelector(".dslot").innerHTML=`<div class="dcard${blocked?" blk":""}"><div class="eback red"><span>${pi("warn")}<b>${T("ภัยพิบัติ","DISASTER")}</b></span></div>
    <div class="dface"><div class="sk">${pi("warn")} ${T("ภัยพิบัติ","DISASTER")}</div><img class="sart" src="${art(k)}" alt=""><div class="st">${T(d.th,d.en)}</div><div class="sz">${zh}</div></div></div>`;
  SFX.cards(1,.05,1);
  await wait(2700);                      // deal + flip + time to read
  const dc=ov.querySelector(".dcard");
  if(blocked){ const tk=TOTEM_OF[k];
    dc.insertAdjacentHTML("beforeend",`<div class="stamp">${timg(tk)}<span>${T(TOTEM[tk][0],TOTEM[tk][1])}</span><small>${T("กันได้!","BLOCKED!")}</small></div>`); SFX.blocked();
    await wait(1700); flyTo(dc,$("desk"),650); ov.querySelector(".edeck").classList.add("leave"); await wait(650) }
  else { ov.querySelector(".edeck").classList.add("leave"); await destroyCard(dc,k) }
  ovClose(); S.busy=false; resolveDisaster(card);
}

/* ---------- hazard-specific card destruction ---------- */
function fxCanvas(dc,pad){ const r=dc.getBoundingClientRect(), c=document.createElement("canvas"); c.className="cardfx";
  c.width=Math.round(r.width+pad*2); c.height=Math.round(r.height+pad*2); Object.assign(c.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:c.width+"px",height:c.height+"px"});
  document.body.appendChild(c); return {c,x:c.getContext("2d"),r,pad} }
function clipHalf(nx,ny,k){ // unit square points with nx*x+ny*y>=k, as CSS polygon
  const P=[[0,0],[1,0],[1,1],[0,1]], out=[]; for(let i=0;i<4;i++){ const a=P[i], b=P[(i+1)%4], fa=nx*a[0]+ny*a[1]-k, fb=nx*b[0]+ny*b[1]-k;
    if(fa>=0) out.push(a); if((fa>=0)!==(fb>=0)){ const t=fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]) } }
  return out.length?`polygon(${out.map(p=>`${(p[0]*100).toFixed(2)}% ${(p[1]*100).toFixed(2)}%`).join(",")})`:"polygon(0 0,0 0,0 0)" }
function run(ms,step){ return new Promise(res=>{ const t0=performance.now(); const f=now=>{ const p=Math.min(1,(now-t0)/ms); step(p,now-t0); if(p<1) requestAnimationFrame(f); else res() }; requestAnimationFrame(f) }) }
async function destroyCard_v1(dc,k){
  if(reduce()){ dc.style.opacity=0; return }
  SFX.hit(k,false);
  const P=[]; const {c,x,r,pad}=fxCanvas(dc,140); const W=r.width, H=r.height;
  const parts=(dt)=>{ for(let i=P.length-1;i>=0;i--){ const q=P[i]; q.l+=dt; q.x+=q.vx; q.y+=q.vy; q.vy+=q.g||0; if(q.l>q.m){P.splice(i,1);continue}
    x.globalAlpha=Math.max(0,1-q.l/q.m); x.fillStyle=q.c; x.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s) } x.globalAlpha=1 };
  if(k==="fire"||k==="ffire"){ // burns from the bottom-left corner to the top-right
    await run(1900,p=>{ const cc=-1+p*2.25;           // line x - y = cc sweeps across the card (y down)
      dc.style.clipPath=clipHalf(1,-1,cc); x.clearRect(0,0,c.width,c.height);
      // glowing edge along the burn line
      for(let s=0;s<1;s+=.02){ const ux=s, uy=ux-cc; if(uy<0||uy>1) continue; const px=pad+ux*W, py=pad+uy*H;
        x.fillStyle="#1B1B2F"; x.fillRect(px-7,py+3,6,6); x.fillStyle="#D94A3A"; x.fillRect(px-3,py-1,5,5); x.fillStyle="#F2C230"; x.fillRect(px-1,py-3,3,3);
        if(Math.random()<.35) P.push({x:px,y:py,vx:.4+Math.random()*1.2,vy:-1-Math.random()*1.4,l:0,m:28+Math.random()*20,c:["#F2C230","#E9783A","#D94A3A","#FFE680"][Math.floor(Math.random()*4)],s:Math.random()<.4?4:3});
        if(Math.random()<.08) P.push({x:px,y:py,vx:.5,vy:-.8,l:0,m:50,c:"#3A3F4A",s:6}) }
      parts(1) });
    await run(500,()=>{ x.clearRect(0,0,c.width,c.height); parts(1) });
  } else if(k==="quake"){ // shakes, cracks, then breaks into pieces that fall away
    const cr=[]; for(let b=0;b<5;b++){ let px=W*(.3+Math.random()*.4), py=H*(.35+Math.random()*.3); const ang=b*1.256+Math.random()*.6, line=[[px,py]]; for(let s=0;s<14;s++){ px+=Math.cos(ang)*W*.05+(Math.random()-.5)*8; py+=Math.sin(ang)*H*.05+(Math.random()-.5)*8; line.push([px,py]) } cr.push(line) }
    await run(950,p=>{ const amp=2+p*7; dc.style.transform=`translate(${(Math.random()-.5)*amp}px,${(Math.random()-.5)*amp}px) rotate(${(Math.random()-.5)*p*2}deg)`;
      x.clearRect(0,0,c.width,c.height); x.strokeStyle="#1B1B2F"; x.lineWidth=3; for(const l of cr){ x.beginPath(); const n=Math.max(2,Math.floor(l.length*p)); l.slice(0,n).forEach((q,i)=>i?x.lineTo(pad+q[0],pad+q[1]):x.moveTo(pad+q[0],pad+q[1])); x.stroke() } });
    dc.style.transform=""; x.clearRect(0,0,c.width,c.height);
    // fragments: jittered 3x3 grid, each a clone of the card clipped to its cell
    const gx=[0,.33+Math.random()*.06-.03,.66+Math.random()*.06-.03,1], gy=[0,.36+Math.random()*.06,.68+Math.random()*.06,1], J=()=>(Math.random()-.5)*.06;
    const pts=gy.map((yy,j)=>gx.map((xx,i)=>[i&&i<3?xx+J():xx,j&&j<3?yy+J():yy])), frags=[];
    const host=dc.parentElement; host.style.position="relative";
    for(let j=0;j<3;j++) for(let i=0;i<3;i++){ const q=[pts[j][i],pts[j][i+1],pts[j+1][i+1],pts[j+1][i]];
      const f=dc.cloneNode(true); f.classList.add("frag"); f.style.animation="none";
      f.querySelectorAll("*").forEach(n=>n.style.animation="none"); const bk=f.querySelector(".eback"); if(bk) bk.remove(); const fc=f.querySelector(".dface"); if(fc) fc.style.transform="none"; f.style.clipPath=`polygon(${q.map(v=>`${v[0]*100}% ${v[1]*100}%`).join(",")})`;
      Object.assign(f.style,{position:"absolute",left:dc.offsetLeft+"px",top:dc.offsetTop+"px",width:dc.offsetWidth+"px",height:dc.offsetHeight+"px",margin:0});
      host.appendChild(f); frags.push({f,vx:(i-1)*2.2+(Math.random()-.5)*2,vy:-2-Math.random()*2.5,rv:(Math.random()-.5)*14}) }
    dc.style.visibility="hidden"; SFX.hit("quake",false);
    for(let n=0;n<40;n++) P.push({x:pad+Math.random()*W,y:pad+H*(.3+Math.random()*.6),vx:(Math.random()-.5)*2,vy:-Math.random()*1.5,g:.05,l:0,m:40,c:["#D4BB8A","#A0A8B0","#C9A97A"][n%3],s:5});
    await run(1300,(p,t)=>{ const tt=t/16; for(const q of frags){ q.f.style.transform=`translate(${q.vx*tt}px,${q.vy*tt+.14*tt*tt}px) rotate(${q.rv*tt*.5}deg)`; q.f.style.opacity=String(1-Math.max(0,p-.5)*2) }
      x.clearRect(0,0,c.width,c.height); parts(1) });
    frags.forEach(q=>q.f.remove());
  } else if(k==="storm"){ // lightning strike, charred black, crumbles into falling ash
    const bolt=[]; let bx=W*.5+(Math.random()-.5)*40, by=-pad; while(by<H*.25){ bolt.push([bx,by]); by+=18; bx+=(Math.random()-.5)*34 } bolt.push([W*.5,H*.22]);
    await run(650,p=>{ x.clearRect(0,0,c.width,c.height); if(p>.15&&p<.75&&Math.floor(p*14)%3!==1){
        x.globalAlpha=.35; x.fillStyle="#FFF7C0"; x.fillRect(pad-10,pad-10,W+20,H+20); x.globalAlpha=1;
        x.strokeStyle="#F2C230"; x.lineWidth=9; x.beginPath(); bolt.forEach((q,i)=>i?x.lineTo(pad+q[0],pad+q[1]):x.moveTo(pad+q[0],pad+q[1])); x.stroke();
        x.strokeStyle="#FFFDE8"; x.lineWidth=3; x.stroke() } });
    x.clearRect(0,0,c.width,c.height);
    dc.style.transition="filter .5s steps(4)"; dc.style.filter="brightness(.28) sepia(.5) contrast(1.3)";
    await run(600,()=>{ if(Math.random()<.5) P.push({x:pad+Math.random()*W,y:pad+Math.random()*H,vx:0,vy:-.6,l:0,m:30,c:"#E9783A",s:3}); x.clearRect(0,0,c.width,c.height); parts(1) });
    await run(1500,p=>{ const top=p*100; dc.style.clipPath=`inset(${top}% 0 0 0)`; const ey=pad+H*p;
      for(let i=0;i<14;i++) P.push({x:pad+Math.random()*W,y:ey+Math.random()*6,vx:(Math.random()-.5)*.8,vy:.6+Math.random()*1.2,g:.03,l:0,m:40+Math.random()*30,c:["#2A2D36","#3A3F4A","#5A6270","#1B1B2F"][i%4],s:Math.random()<.5?3:4});
      x.clearRect(0,0,c.width,c.height); parts(1) });
    await run(500,()=>{ x.clearRect(0,0,c.width,c.height); parts(1) });
  } else { // flood: water rises inside the card, the card soaks through, then sinks with bubbles
    let lvl=0;
    await run(1300,(p,t)=>{ lvl=p; x.clearRect(0,0,c.width,c.height); const top=pad+H*(1-lvl);
      x.save(); x.beginPath(); x.rect(pad,pad,W,H); x.clip();
      x.globalAlpha=.62; x.fillStyle="#2F5F9E"; x.beginPath(); x.moveTo(pad,pad+H); for(let px=0;px<=W;px+=6) x.lineTo(pad+px,top+Math.sin(px/18+t/120)*5); x.lineTo(pad+W,pad+H); x.fill();
      x.globalAlpha=1; x.fillStyle="#9CCBF0"; for(let px=0;px<=W;px+=6) x.fillRect(pad+px,top+Math.sin(px/18+t/120)*5-1,4,2); x.restore();
      if(Math.random()<.6) P.push({x:pad+Math.random()*W,y:pad+H-4,vx:0,vy:-1.2,l:0,m:H*(lvl)/1.2,c:"#C8F2E8",s:3}); parts(1);

  if(S.phase==="draw") promptDraw();
  else if(S.phase==="events") nextStep();
  else if(S.phase==="roll") promptRoll();
  else if(S.phase==="disdraw") promptDisDraw();
  else if(S.phase==="strike"&&S.curDis){ S.busy=false; resolveDisaster(S.curDis) }
}

function resolveDisaster(card){
  const k=card.k; S.disCard=card; S.curDis=null; S.stats.dis++; S.stats.hz=S.stats.hz||{}; S.stats.hz[k]=(S.stats.hz[k]||0)+1;
  if(S.totems.includes(TOTEM_OF[k])){ const tk=TOTEM_OF[k]; S.blocked=true; S.stats.blocked++; log(`${disLabel(card,"th")}: ${TOTEM[tk][0]}กันได้ทั้งใบ`,`${disLabel(card,"en")}: blocked by ${TOTEM[tk][1]}`,"good");
    let box; if(k==="ffire"){ const fs=S.pieces.filter(p=>p.type==="factory"), f=fs.length?fs[rnd(fs.length)]:null;
      if(f){ const rs=f.cells.map(x=>x[0]), cs=f.cells.map(x=>x[1]); box={r0:Math.max(0,Math.min(...rs)-1),r1:Math.min(N-1,Math.max(...rs)+1),c0:Math.max(0,Math.min(...cs)-1),c1:Math.min(N-1,Math.max(...cs)+1),fac:true} } }
    else box=zoneBox(card.z);
    S.msg={th:`${TOTEM_ACT[tk][0]} ${TOTEM[tk][0]}กัน${DIS[k].th}ได้ทั้งใบ`,en:`${TOTEM_ACT[tk][1]} Your ${TOTEM[tk][1]} blocks the whole ${DIS[k].en.toLowerCase()} card.`};
    S.phase="build";
    if(!box){ FX.shield(); render(); return }
    S.zone=box; S.hits=[]; S.saved=[]; S.busy=true; const dur=FX.blocked(k,box); render();
    setTimeout(()=>{ S.busy=false; toast(T(TOTEM_ACT[tk][0],TOTEM_ACT[tk][1]),"good"); render() },dur); return }
  let targets=[], box;
  if(k==="ffire"){
    const fs=S.pieces.filter(p=>p.type==="factory");
    if(!fs.length){ log("ไฟไหม้โรงงาน แต่ไม่มีโรงงาน","Factory fire, but no factory","good"); S.msg={th:"ไม่มีโรงงานในเมือง ไม่เกิดอะไร",en:"No factory in the city. Nothing happens."}; S.phase="build"; render(); return }
    const f=fs[rnd(fs.length)]; S.ffSrc=f.id;
    targets=S.pieces.filter(p=>p===f||(p.type!=="green"&&touches(p,f)));
    const rs=f.cells.map(x=>x[0]), cs=f.cells.map(x=>x[1]);
    box={r0:Math.max(0,Math.min(...rs)-1),r1:Math.min(N-1,Math.max(...rs)+1),c0:Math.max(0,Math.min(...cs)-1),c1:Math.min(N-1,Math.max(...cs)+1),fac:true};
  } else {
    const Z=ZONES[card.z]; box=zoneBox(card.z);
    targets=S.pieces.filter(p=>HAZ[k].hits.includes(p.type)&&p.cells.some(([r,c])=>zoneOf(r,c)===card.z));
  }
  strike(k,box,targets);
}
function strike(k,box,targets){
  S.zone=box; S.hits=[]; S.saved=[];
  for(const p of targets){ if(p.dmg) continue; if(p.rf){ p.rf=false; S.saved.push(p.id); continue } p.dmg=true; p.dk=k; S.hits.push(p.id) }
  S.stats.hits+=S.hits.length; S.stats.saved+=S.saved.length; S.stats.zhit=S.stats.zhit||{}; if(k==="ffire") S.stats.ffhits=(S.stats.ffhits||0)+S.hits.filter(id=>id!==S.ffSrc).length;
  S.hits.forEach(id=>{const q=S.pieces.find(x=>x.id===id); const z=q&&zoneOf(q.cells[0][0],q.cells[0][1]); if(z) S.stats.zhit[z]=(S.stats.zhit[z]||0)+1});
  const card=S.disCard, names=S.hits.map(id=>nm(S.pieces.find(p=>p.id===id).type));
  log(`${disLabel(card,"th")}: พัง ${S.hits.length} หลัง${S.saved.length?` · เสริมแล้วรอด ${S.saved.length}`:""}`,`${disLabel(card,"en")}: ${S.hits.length} damaged${S.saved.length?` · ${S.saved.length} saved by reinforcement`:""}`,S.hits.length?"bad":"good");
  const svt=S.saved.length?` · เสริมความแข็งแรงช่วยไว้ ${S.saved.length} หลัง`:"", sve=S.saved.length?` · reinforcement saved ${S.saved.length}`:"";
  const nmTh=S.hits.map(id=>NAME[S.pieces.find(p=>p.id===id).type][0]);
  S.msg=S.hits.length?{th:`${nmTh.join(", ")} พัง${svt}`,en:`${S.hits.length} building(s) damaged${sve}`}
                     :{th:`ไม่มีอาคารพัง${svt||" รอดไป"}`,en:`Nothing damaged${sve||". A near miss."}`};
  let dur=0; try{ dur=FX.disaster(k,box,S.hits,S.saved) }catch(err){ dur=0; S.hits.forEach(id=>dmgShow.set(id,0)); try{console.error(err)}catch(e2){} }
  S.phase="build"; S.busy=true; render();
  setTimeout(()=>{ S.busy=false; if(S.hits.length) toast(T(`${DIS[k].th}! พัง ${S.hits.length} หลัง`,`${DIS[k].en}! ${S.hits.length} damaged`),"bad"); else if(S.saved.length) toast(T("เสริมความแข็งแรงช่วยไว้!","Reinforcement held!"),"good"); render() },dur);
}
function endRound(){
  S.tool=null;
  if(S.practice&&S.round>=PRACTICE.rounds){ practiceDone(); return }
  if(S.round>=ROUNDS){ const n=stars(); S.result=n; S.phase="over"; log(`จบวาระ: ${n} ดาว · ${rankOf(n)[0]}`,`Term over: ${n} stars · ${rankOf(n)[1]}`,n>=4?"good":"bad");
    LB.list=null; render(); const show=()=>{S.modal="end";renderModal()};
    if(n>=8){ celebrate(show); return }
    if(n>=6){ FX.confetti(); SFX.win() } else if(n>=4) SFX.good(); else SFX.lose();
    setTimeout(show,reduce()||n<6?0:1300); return }
  startRound();
}

/* build */
const priceOf=t=>(t==="house"&&S.mod.freehouse)?0:PRICE[t]+(S.mod.buildcost||0);
const totemPrice=()=>Math.max(0,TOTEM_STEPS[Math.min(3,S.totems.length)]-(S.mod.totemdisc||0));
function cellsFor(t,r,c,o){ return SIZE[t]?(o==="h"?[[r,c],[r,c+1]]:[[r,c],[r+1,c]]):[[r,c]] }
function fits(t,r,c,o){ const m=occ(); return cellsFor(t,r,c,o).every(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!isRoad(a,b)&&!m[a+","+b]) }
function nearHome(t,r,c,o){ if(!NEEDS_HOME[t]) return true; const cs=cellsFor(t,r,c,o);
  return S.pieces.some(p=>(p.type==="house"||p.type==="condo")&&p.cells.some(a=>cs.some(b=>side(a,b)))) }
const HOMES={house:1,condo:1};
function zoneOK(t,r,c,o){ if(!ZONING||!(t==="factory"||HOMES[t])) return true; const cs=cellsFor(t,r,c,o);
  return !S.pieces.some(p=>(t==="factory"?HOMES[p.type]:p.type==="factory")&&p.cells.some(a=>cs.some(b=>side(a,b)))) }
function zoneMsg(t){ return t==="factory"?T("โรงงานห้ามวางติดบ้านหรือคอนโด (แยกเขตอุตสาหกรรมออกจากที่อยู่อาศัย)","A factory can't share a side with a house or apartment block (keep industry away from homes)")
  :T(`${nm(t)}ห้ามวางติดโรงงาน (แยกที่อยู่อาศัยออกจากเขตอุตสาหกรรม)`,`A ${nm(t).toLowerCase()} can't share a side with a factory (keep homes away from industry)`) }
function canPlace(t,r,c,o){ return fits(t,r,c,o)&&nearHome(t,r,c,o)&&zoneOK(t,r,c,o) }
function anySpot(t){ for(const [r,c] of LOTS) for(const o of SIZE[t]?["h","v"]:["h"]) if(canPlace(t,r,c,o)) return true; return false }
function why(t){
  if(S.phase!=="build"||S.busy) return T("รอช่วงบริหารเมือง","Wait for the build phase");
  if(S.coins<priceOf(t)) return T("เงินไม่พอ","Not enough coins");
  if(NEEDS_HOME[t]&&!anySpot(t)) return T("ไม่มีช่องว่างที่ติดบ้านหรือคอนโด","No free lot next to a house or apartment block");
  if(t==="factory"&&!anySpot(t)) return T("ไม่มีช่องว่างที่ห่างจากบ้านและคอนโด","No free lots away from houses and apartment blocks");
  if(!anySpot(t)) return HOMES[t]&&S.pieces.some(p=>p.type==="factory")?T("ไม่มีช่องว่างที่ไม่ติดโรงงาน","No free lot that isn't next to a factory"):T("ไม่มีช่องว่างที่วางได้","No free lot left for this");
  return "";
}
function place(r,c){
  const t=S.tool; if(!PRICE[t]) return;
  const w=why(t); if(w){toast(w,"bad");return}
  if(!fits(t,r,c,S.orient)){ const m=SIZE[t]?T("ต้องมี 2 ช่องว่างติดกัน และข้ามถนนไม่ได้ กดหมุนเพื่อเปลี่ยนทิศ","Needs 2 free lots side by side, not across a road. Rotate to turn it."):T("ช่องนี้วางไม่ได้","You can't build here"); toast(m,"bad"); return }
  if(!nearHome(t,r,c,S.orient)){ toast(T(`${nm(t)}ต้องวางติดด้านข้างกับบ้านหรือคอนโด (ทแยงไม่นับ)`,`A ${nm(t).toLowerCase()} must share a side with a house or apartment block (diagonals don't count)`),"bad"); return }
  if(!zoneOK(t,r,c,S.orient)){ toast(zoneMsg(t)+T(" · ทแยงได้"," · diagonals are fine"),"bad"); return }
  const cost=priceOf(t), free=(t==="house"&&S.mod.freehouse>0);
  const p={id:S.nextId++,type:t,cells:cellsFor(t,r,c,S.orient),dmg:false,rf:false}; S.pieces.push(p); S.coins-=cost; bump(-cost); FX.build(p);
  if(free) S.mod.freehouse--;
  let ffCard=false; if(t==="factory"){ S.ff++; if(S.disDeck.length){S.disDeck.splice(rnd(S.disDeck.length+1),0,{k:"ffire"}); ffCard=true} }
  S.undo.push({kind:"piece",id:p.id,cost,free,ffCard});
  log(`สร้าง${nm(t)} ที่ ${code(r,c)}${cost?` (−${cost})`:" (ฟรี)"}`,`Built ${nm(t).toLowerCase()} at ${code(r,c)}${cost?` (−${cost})`:" (free)"}`);
  if(why(t)) S.tool=null; render();
}
let gotTotem=null;
function buyTotem(k){
  if(S.phase!=="build"||S.busy||S.totems.includes(k)||S.coins<totemPrice()) return;
  const cost=totemPrice(); S.coins-=cost; bump(-cost); S.totems.push(k); S.undo.push({kind:"totem",k,cost}); gotTotem=k; FX.shieldSmall();
  log(`ซื้อ Totem ${TOTEM[k][0]} (−${cost})`,`Bought the ${TOTEM[k][1]} Totem (−${cost})`); render();
}
function repair(id){
  const p=S.pieces.find(x=>x.id===id); if(!p||!p.dmg) return;
  const free=(S.mod.freerepair||0)>0, cost=free?0:PRICE[p.type];
  if(S.coins<cost){toast(T("เงินไม่พอซ่อม","Not enough coins to repair"),"bad");return}
  p.dmg=false; S.coins-=cost; bump(-cost); if(free) S.mod.freerepair--; S.stats.rep=(S.stats.rep||0)+cost; FX.sparkle(p);
  S.undo.push({kind:"repair",id,cost,free}); log(`ซ่อม${nm(p.type)}${cost?` (−${cost})`:" (ฟรี)"}`,`Repaired ${nm(p.type).toLowerCase()}${cost?` (−${cost})`:" (free)"}`);
  if(!damaged().length) S.tool=null; render();
}
const canRF=p=>p&&p.type!=="green"&&!p.dmg&&!p.rf;
function reinforce(id){
  const p=S.pieces.find(x=>x.id===id); if(!canRF(p)){ if(p&&p.rf) toast(T("หลังนี้เสริมแล้ว","Already reinforced"),"bad"); else if(p&&p.type==="green") toast(T("พื้นที่สีเขียวไม่พังอยู่แล้ว","Parks are never damaged"),"bad"); else if(p&&p.dmg) toast(T("ซ่อมก่อนจึงเสริมได้","Repair it first"),"bad"); return }
  if(S.coins<RF_PRICE){toast(T("เงินไม่พอ","Not enough coins"),"bad");return}
  p.rf=true; S.coins-=RF_PRICE; bump(-RF_PRICE); FX.sparkle(p);
  S.undo.push({kind:"rf",id,cost:RF_PRICE}); log(`เสริมความแข็งแรง${nm(p.type)} (−${RF_PRICE})`,`Reinforced ${nm(p.type).toLowerCase()} (−${RF_PRICE})`);
  if(S.coins<RF_PRICE||!S.pieces.some(canRF)) S.tool=null; render();
}
function strands(p){ if(p.type!=="house"&&p.type!=="condo") return null;
  const rest=S.pieces.filter(q=>q!==p);
  return rest.find(q=>NEEDS_HOME[q.type]&&!rest.some(h=>(h.type==="house"||h.type==="condo")&&touches(q,h)))||null }
function demolish(id){
  const p=S.pieces.find(x=>x.id===id); if(!p) return;
  const lone=strands(p); if(lone){ toast(T(`รื้อไม่ได้: ${nm(lone.type)}ที่ ${code(...lone.cells[0])} จะไม่มีบ้านหรือคอนโดติดอยู่ รื้อ${nm(lone.type)}ก่อน`,`Can't demolish: the ${nm(lone.type).toLowerCase()} at ${code(...lone.cells[0])} would have no home next to it. Demolish it first.`),"bad"); return }
  const i=S.pieces.indexOf(p); S.pieces.splice(i,1);
  let ffCard=false; if(p.type==="factory"){ S.ff--; let j=-1; S.disDeck.forEach((c,k)=>{if(c.k==="ffire")j=k}); if(j>=0){S.disDeck.splice(j,1);ffCard=true} }
  FX.demolish(p);
  S.undo.push({kind:"demolish",piece:p,idx:i,ffCard,cost:0});
  log(`รื้อ${nm(p.type)} ที่ ${code(...p.cells[0])}${p.dmg?" (ที่พังอยู่)":""}`,`Demolished ${nm(p.type).toLowerCase()} at ${code(...p.cells[0])}${p.dmg?" (damaged)":""}`);
  if(!S.pieces.length) S.tool=null; render();
}
function undo(){
  const u=S.undo.pop(); if(!u) return;
  if(u.kind==="piece"){ const p=S.pieces.find(x=>x.id===u.id); S.pieces=S.pieces.filter(x=>x.id!==u.id);
    if(p&&p.type==="factory"){ S.ff--; if(u.ffCard){ let i=-1; S.disDeck.forEach((c,j)=>{if(c.k==="ffire")i=j}); if(i>=0) S.disDeck.splice(i,1) } }
    if(u.free) S.mod.freehouse=(S.mod.freehouse||0)+1 }
  if(u.kind==="totem") S.totems=S.totems.filter(t=>t!==u.k);
  if(u.kind==="repair"){ const p=S.pieces.find(x=>x.id===u.id); if(p) p.dmg=true; S.stats.rep=(S.stats.rep||0)-u.cost; if(u.free) S.mod.freerepair=(S.mod.freerepair||0)+1 }
  if(u.kind==="rf"){ const p=S.pieces.find(x=>x.id===u.id); if(p) p.rf=false }
  if(u.kind==="demolish"){ S.pieces.splice(u.idx,0,u.piece); if(u.piece.type==="factory"){ S.ff++; if(u.ffCard) S.disDeck.splice(rnd(S.disDeck.length+1),0,{k:"ffire"}) } }
  S.coins+=u.cost; bump(u.cost); S.log.shift(); render();
}
function nextStarTxt(){
  const out=[];
  for(const k of STAR_KEYS){ const v=metric(k), t=STAR[k], s=starOf(k); if(s>=2) continue; const goal=t[s], lab=STAR_LAB[k];
    out.push(T(`${lab[0]} อีก ${goal-v}`,`${goal-v} more ${lab[1]}`)) }
  return out;
}
function advice(){
  if(S.phase!=="build"||S.busy) return "";
  const left=ROUNDS-S.round, dm=damaged().length;
  if(dm&&left<=1) return T(`มีอาคารพัง ${dm} หลัง อาคารพังไม่นับดาว ซ่อมก่อนจบรอบสุดท้าย`,`${dm} building(s) damaged. Damaged buildings don't count for stars. Repair before the final round ends.`);
  if(S.round>=2&&S.round<=7&&S.totems.length<2) return T(`รอบหน้าโอกาสเกิดภัยราว ${chance(riskParts(S.round+1).v)}% ดูว่าโซนไหนมีอาคารมาก แล้วซื้อ Totem ภัยนั้นหรือเสริมความแข็งแรง`,`Next round's disaster chance is about ${chance(riskParts(S.round+1).v)}%. Check which zone holds most of your city, then buy that Totem or reinforce.`);
  if(S.pieces.some(p=>p.type==="factory"&&S.pieces.some(q=>q!==p&&q.type!=="green"&&touches(p,q)))&&!S.totems.includes("fire")&&S.round<=9)
    return T("ไฟไหม้โรงงานทำให้อาคารที่ติดโรงงานพังด้วย","A factory fire also damages every building touching the factory.");
  const miss=nextStarTxt();
  if(miss.length) return T(`ดาวถัดไป: ${miss.join(" · ")} · เหลือ ${left} รอบ`,`Next stars: ${miss.join(" · ")} · ${left} round(s) left`);
  return T("ได้ครบ 8 ดาวแล้ว รักษาเมืองไว้ให้ถึงรอบ 12","All 8 stars. Keep the city safe until round 12.");
}

function emit(n,o){for(let i=0;i<n;i++)parts.push(Object.assign({x:0,y:0,vx:(Math.random()-.5)*.6,vy:-Math.random()*.6,life:0,max:40+rnd(30),col:"#A0A8B0",sz:1,g:0},typeof o==="function"?o(i):o))}
function pieceRect(p){const rs=Math.min(...p.cells.map(x=>x[0])),cs=Math.min(...p.cells.map(x=>x[1])),re=Math.max(...p.cells.map(x=>x[0])),ce=Math.max(...p.cells.map(x=>x[1]));return {x:cs*TILE,y:rs*TILE,w:(ce-cs+1)*TILE,h:(re-rs+1)*TILE}}
function zoneRect(z){const r0=z.r0,r1=z.r1,c0=z.c0,c1=z.c1;return {x:c0*TILE,y:r0*TILE,w:(c1-c0+1)*TILE,h:(r1-r0+1)*TILE}}

  coins(n){ if(reduce()||!n)return; for(const p of S.pieces){ if(p.dmg||!INCOME[p.type])continue; const r=pieceRect(p);
    for(let i=0;i<Math.min(3,INCOME[p.type]);i++) parts.push({x:r.x+r.w/2-2+i*3,y:r.y+2,vx:0,vy:-.35,life:-i*6,max:34,col:"#F2C230",sz:2,coin:1}) } },

function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null} } if(AC&&AC.state==="suspended") AC.resume().catch(()=>{}); return AC }

function tone(f,d,o){ o=o||{}; const a=ac(); if(!a||MUTED) return; const t=a.currentTime+(o.at||0);
  const osc=a.createOscillator(), g=a.createGain(); osc.type=o.type||"square"; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.vol||.05; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t+d+.02) }
function noise(d,o){ o=o||{}; const a=ac(); if(!a||MUTED) return; const t=a.currentTime+(o.at||0);
  const len=Math.max(1,Math.floor(a.sampleRate*d)), buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(o.crackle?(Math.random()<.08?1:.15):1);
  const src=a.createBufferSource(); src.buffer=buf; const fl=a.createBiquadFilter(); fl.type=o.ftype||"lowpass"; fl.frequency.setValueAtTime(o.f||1200,t);
  if(o.fto) fl.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  const g=a.createGain(), v=o.vol||.08; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(t); src.stop(t+d+.02) }

function freshPractice(){ const s=fresh(); const L=START_MAPS.find(m=>m.id===PRACTICE.map), Z=ZONES[L.z], at=([r,c])=>[[Z.r[0]+r,Z.c[0]+c]];
  s.pieces=[]; s.nextId=1; const add=(type,cells)=>s.pieces.push({id:s.nextId++,type,cells,dmg:false,rf:false});
  L.h.forEach(x=>add("house",at(x))); add("shop",at(L.s)); add("green",at(L.g));
  s.startMap=L.id; s.practice=true; s.coins=PRACTICE.coins;
  s.log=[{r:0,th:"โหมดฝึก: เมืองเริ่มที่ริมแม่น้ำ",en:"Practice: your town starts in Riverside",kind:""}]; return s }
function practiceStart(){ PREV=null; S=freshPractice(); S.modal=null; effects=[]; parts=[]; dmgShow.clear(); drops.clear();

  return t?`<div class="pcap"><span>${T("โหมดฝึก","PRACTICE")}</span>${T(t[0],t[1])}</div>`:"" }
function tutTick(){
  if(!TUT.on) return;
  let st=TSTEPS[TUT.step];
  while(st&&((st.done&&st.done())||(st.skip&&st.skip()))){ TUT.step++; st=TSTEPS[TUT.step] }
  if(!st){ tutEnd(true); return }
  if(st.enter&&TUT.entered!==TUT.step&&S.phase==="build"&&!S.busy){ TUT.entered=TUT.step; st.enter(); return }
  coach();
}
function coach(){
  let el=$("coach"), ring=$("coachring");
  if(!el){ el=document.createElement("div"); el.id="coach"; document.body.appendChild(el); ring=document.createElement("div"); ring.id="coachring"; document.body.appendChild(ring) }
  const st=TUT.on&&TSTEPS[TUT.step];
  const blocked=!st||S.modal||S.busy||$("splash").className.includes("show")||(st.show&&!st.show())||(!st.show&&S.phase!=="build");
  const tgt=st&&!blocked&&document.querySelector(st.sel);
  if(!tgt){ el.className=""; ring.className=""; return }
  const phone=!matchMedia("(min-width:821px) and (orientation:landscape)").matches, onMap=phone&&st.sel==="#stage";
  if(el.dataset.k!==String(TUT.step)){ el.dataset.k=TUT.step; if(onMap) mapIntoView(); else try{tgt.scrollIntoView({block:"center",behavior:"smooth"})}catch(e){}
    el.innerHTML=`<div class="cstep">${T("โหมดฝึก","Practice")} · ${T("รอบ","round")} ${S.round}/${PRACTICE.rounds}</div><p>${T(st.th,st.en)}</p><div class="cbtn">${st.next?`<button type="button" class="primary" data-tut="next">${T("ถัดไป ▶︎","Next ▶︎")}</button>`:""}<button type="button" class="ghostbtn" data-tut="skip">${T("ข้ามไปเกมจริง","Skip to the real game")}</button></div>` }
  const r=tgt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  ring.className="on"; Object.assign(ring.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px"});
  el.className="on"+(phone?" ph":""); const w=Math.min(320,vw-24); el.style.width=w+"px"; el.style.maxHeight=""; let h=el.offsetHeight;
  if(onMap){ // phones: keep the whole map visible, the bubble sits under it (scrolls inside itself if space is short)
    const left0=Math.max(12,(vw-w)/2); let top0=r.bottom+8; if(vh-top0-8<120) top0=vh-128;
    el.style.maxHeight=(vh-top0-8)+"px"; el.style.left=left0+"px"; el.style.top=top0+"px"; return }
  let left=Math.max(12,Math.min(vw-w-12,r.left+r.width/2-w/2)), top=r.bottom+14;
  if(top+h>vh-8) top=r.top-h-14;
  if(top<8){ // big target (the map): put the bubble beside it, or pinned to the bottom edge
    if(vw-r.right>=w+24){ left=r.right+14; top=Math.max(8,Math.min(vh-h-8,r.top+r.height/2-h/2)) }
    else if(r.left>=w+24){ left=r.left-w-14; top=Math.max(8,Math.min(vh-h-8,r.top+r.height/2-h/2)) }
    else top=Math.max(8,Math.min(vh-h-8,r.bottom-h-10)) }
  el.style.left=left+"px"; el.style.top=top+"px";
}

  blds.forEach(p=>{const z=zoneOf(p.cells[0][0],p.cells[0][1]); zc[z]=(zc[z]||0)+1});
  const zTop=Object.keys(zc).sort((a,b)=>zc[b]-zc[a])[0], share=zTop&&blds.length?zc[zTop]/blds.length:0, zh=(st.zhit||{})[zTop]||0;
  if(!st.dis) L.push(["เมืองคุณไม่เจอภัยเลยตลอดวาระ ถือว่าโชคดีมาก แต่ในชีวิตจริงเราไม่รู้ว่าภัยจะมาเมื่อไร จึงต้องเตรียมพร้อมไว้เสมอ","No disaster hit your city all term. Lucky! In real life nobody knows when one will come, so cities prepare anyway."]);
  if(st.blocked) L.push([`Totem กันภัยไว้ได้ทั้งใบ ${st.blocked} ครั้ง การเตรียมพร้อมก่อนภัยมา คุ้มกว่าตามซ่อมทีหลัง`,`Your Totems blocked ${st.blocked} whole disaster card(s). Preparing before a disaster beats repairing after it.`]);
  if(st.saved) L.push([`การเสริมความแข็งแรงช่วยอาคารไว้ ${st.saved} หลัง ใช้เงินน้อยกว่าสร้างใหม่มาก`,`Reinforcing saved ${st.saved} building(s), far cheaper than rebuilding.`]);
  if(blds.length>=4&&share>=.6&&zh>=2) L.push([`อาคาร ${Math.round(share*100)}% ของเมืองอยู่ใน${ZONES[zTop].th} และโดนภัยในโซนนี้ ${zh} หลัง การกระจายเมืองไปหลายโซนช่วยไม่ให้ภัยครั้งเดียวทำลายเมืองทั้งหมด`,`${Math.round(share*100)}% of your buildings were in ${ZONES[zTop].en}, and ${zh} were hit there. Spreading out keeps one disaster from wrecking the whole city.`]);
  if((st.rep||0)>=10) L.push([`คุณจ่ายค่าซ่อมไป ${st.rep} เหรียญ ถ้าเสริมความแข็งแรงไว้ก่อน (หลังละ 3) จะถูกกว่ามาก`,`You spent ${st.rep} coins on repairs. Reinforcing first (3 each) would have cost much less.`]);

  document.body.appendChild(o);
  const cvs=o.querySelector("canvas"), x=cvs.getContext("2d"); let W,H; const fit=()=>{W=cvs.width=Math.ceil(innerWidth/4);H=cvs.height=Math.ceil(innerHeight/4)}; fit();
  const P=[], cols=["#F2C230","#FFE680","#D94A3A","#7FC1F2","#5CB85C","#F4F4F4","#C58CF2"];
  const burst=()=>{ const cx=W*(.15+Math.random()*.7), cy=H*(.12+Math.random()*.45), c=cols[rnd(cols.length)], c2=cols[rnd(cols.length)];
    for(let i=0;i<46;i++){ const a=i/46*Math.PI*2, s=.6+Math.random()*1.3; P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:55+rnd(30),c:i%3?c:c2}) } };
  for(let i=0;i<60;i++) P.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*.3,vy:.4+Math.random()*.6,l:0,m:400,c:cols[rnd(cols.length)],conf:1});
  const t0=performance.now(); let lastB=0, done=false;
  const end=()=>{ if(done) return; done=true; o.classList.add("out"); setTimeout(()=>{o.remove();cb()},450) };
  o.addEventListener("click",end);
  const frame=now=>{ if(done) return; const t=now-t0; if(t-lastB>380&&t<4200){ burst(); lastB=t }
    x.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.l++; p.x+=p.vx; p.y+=p.vy; if(!p.conf){p.vy+=.025;p.vx*=.985} else p.x+=Math.sin((p.l+i)/12)*.2;
      if(p.l>p.m||p.y>H+4){P.splice(i,1);continue} x.globalAlpha=p.conf?1:Math.max(0,1-p.l/p.m); x.fillStyle=p.c; x.fillRect(Math.round(p.x),Math.round(p.y),p.conf?2:1,p.conf?1+(p.l>>3)%2:1) }
    x.globalAlpha=1; if(t>5600) end(); else requestAnimationFrame(frame) };
  requestAnimationFrame(frame);
}

const LB_URL="https://script.google.com/macros/s/AKfycbwMMhNWf0rFotOf5leoOPpS9kLx1zDJiQ0hNjqsPV7PL1MGajFGqV4dab6yzy8q8jtBdg/exec";   // Google Apps Script web-app URL goes here

async function lbFetch(entry){
  LB.loading=true; LB.err=false; lbPaint();

    const post=async e=>{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(LB_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(e),signal:ctl.signal}); clearTimeout(to); return r.json() };
    let j=null;

    try{ localStorage.setItem("mm-lbq",JSON.stringify(q.slice(-20))) }catch(e){}
    if(!LB.err){ try{
      if(!j){ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
        const r=await fetch(LB_URL+"?a=top&_="+Date.now(),{cache:"no-store",signal:ctl.signal}); clearTimeout(to); j=await r.json() }

}
